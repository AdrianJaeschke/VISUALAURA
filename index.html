<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shield Sphere - Gesture & Touch</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: sans-serif; font-size: 11px; z-index: 10;
            text-transform: uppercase; letter-spacing: 1px; pointer-events: none;
        }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        button {
            padding: 20px 40px; background: none; border: 2px solid #00f0ff;
            color: #00f0ff; cursor: pointer; letter-spacing: 3px; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="ui">SYSTEM: READY<br>INPUT: <span id="status">TOUCH/MOUSE</span></div>
<div id="overlay"><button id="start">INITIALIZE SHIELD</button></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 3.05,
        detail: 2,
        stripeDensity: 12.0,
        shieldSize: 0.55,          // Radius des Sichtfensters
        shieldSharpness: 0.05,     // Härte der Kante
        shieldOpacity: 1.0,        // Deckkraft
        lerpFactor: 0.15           // Wie schnell das Schild dem Finger folgt
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 pPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    const innerMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            void main() {
                float zebra = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0));
                vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                float fres = pow(1.0 - abs(vNormal.z), 2.0);
                gl_FragColor = vec4(mix(vec3(zebra), rainbow, fres), 1.0);
            }
        `
    });

    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uAspect: { value: window.innerWidth / window.innerHeight },
            uIsOutline: { value: false }
        },
        transparent: true,
        depthTest: true,
        depthWrite: false, // Wichtig für Überlagerung
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            uniform vec2 uMouse;
            uniform float uAspect;
            uniform float uTime;
            uniform bool uIsOutline;
            void main() {
                vec2 diff = vScreenPos - uMouse;
                diff.x *= uAspect;
                float dist = length(diff);
                float mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, dist);
                
                if (mask < 0.01) discard;

                vec3 col = uIsOutline ? vec3(1.0) : 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.4) + vec3(0, 0.33, 0.67)));
                gl_FragColor = vec4(col, mask * ${CONFIG.shieldOpacity});
            }
        `
    });

    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), innerMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    const shieldFill = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(shieldFill);

    const shieldOutlineMat = shieldMat.clone();
    shieldOutlineMat.uniforms.uIsOutline.value = true;
    shieldOutlineMat.wireframe = true;
    const shieldOutline = new THREE.Mesh(ghostGeo, shieldOutlineMat);
    scene.add(shieldOutline);

    // --- INTERAKTION (TOUCH & MAUS) ---
    function updateInput(x, y) {
        targetInput.x = (x / window.innerWidth) * 2 - 1;
        targetInput.y = -(y / window.innerHeight) * 2 + 1;
    }

    document.getElementById('start').onclick = () => {
        document.getElementById('overlay').style.display = 'none';
        
        // Maus
        window.addEventListener('mousemove', (e) => updateInput(e.clientX, e.clientY));
        
        // Touch (Gesten)
        window.addEventListener('touchstart', (e) => updateInput(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            updateInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        const time = performance.now() * 0.001;
        innerMat.uniforms.uTime.value = time;
        shieldMat.uniforms.uTime.value = time;
        shieldOutlineMat.uniforms.uTime.value = time;

        shieldMat.uniforms.uMouse.value.copy(currentInput);
        shieldOutlineMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += 0.005;
        
        // Das Schild neigt sich zum Finger
        shieldFill.rotation.set(-currentInput.y * 0.5, currentInput.x * 0.5, 0);
        shieldOutline.rotation.set(-currentInput.y * 0.5, currentInput.x * 0.5, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        const a = window.innerWidth / window.innerHeight;
        camera.aspect = a;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = a;
        shieldOutlineMat.uniforms.uAspect.value = a;
    };
</script>
</body>
</html>
