<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Minimal Hybrid Spike Sphere</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        
        canvas { display: block; }
        
        /* Typo ohne Hintergrund direkt auf dem Bild */
        #ui {
            position: fixed; 
            top: 30px; 
            left: 30px; 
            color: #00f0ff; 
            font-family: "Boldonse", system-ui; 
            font-size: 45px;
            pointer-events: none; 
            z-index: 100; 
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.6;
            /* Subtiler Glow für Lesbarkeit auf hellem Grund */
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Mobile Overlay ohne Blur/Hintergrund für maximale Transparenz */
        #mobile-overlay {
            position: fixed; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 15px 30px; 
            background: transparent; 
            border: 1px solid #00f0ff;
            color: #00f0ff; 
            font-family: "Boldonse", system-ui;
            font-size: 16px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s ease;
        }

        #start-btn:active {
            background: rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body>

<div id="ui">
    <span id="device-mode">System: Detecting</span><br>
    <span id="sensor-status">Sensor: Touch Active</span>
</div>

<div id="mobile-overlay">
    <button id="start-btn">Klicken und Handy bewegen/button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        detail: 20,
        spikeSharpness: 25.0,
        maxReach: 0.4,
        stripeDensity: 15.0,
        viewAngle: 25,
        rotationSpeed: 0.005,
        gyroSensitivity: 2.2,
        lerpFactor: 0.05 
    };

    const angleThreshold = Math.cos(CONFIG.viewAngle * (Math.PI / 180));
    let targetInput = { x: 0, y: 0 };
    let currentInput = { x: 0, y: 0 };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 1.0 },
            uThreshold: { value: angleThreshold }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;

            void main() {
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.7, 0.0, d);
                float noise = sin(position.x * 10.0) * cos(position.y * 10.0 + uTime);
                vSpike = pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)});
                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
       fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform float uThreshold;

            vec3 spectral(float t) {
                return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
            }

            void main() {
                // 1. Geometrie & Sichtwinkel
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                vec3 viewDir = normalize(cameraPosition - vWorldPos);
                float cameraFacing = dot(fNormal, viewDir);
                
                // 2. DAS ZEBRA (Strikt Schwarz-Weiß)
                // Wir nutzen ein schärferes smoothstep für klare Streifen
                float stripePattern = sin(vWorldPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0);
                float zebra = smoothstep(-0.05, 0.05, stripePattern); 
                
                // 3. DIE FARBE (Butterweich)
                // Wir berechnen die Iridiszenz unabhängig
                float colorShift = cameraFacing * 0.4 + uTime * 0.2 + vSpike * 0.3;
                vec3 rainbow = spectral(colorShift);
                
                // 4. MASKE FÜR DIE FARBE
                // Nur dort, wo die Kugel zur Kamera zeigt, leuchtet sie
                float iridMask = smoothstep(uThreshold - 0.2, uThreshold + 0.3, cameraFacing);
                
                // 5. KOMPOSITION
                // Wir nehmen das Zebra (0 oder 1) und multiplizieren es mit der Farbe,
                // aber lassen das Schwarz echt Schwarz (0 * Farbe = 0).
                vec3 color = mix(vec3(0.0), rainbow, zebra);
                
                // Die Intensität der Farbe wird durch den Winkel gesteuert
                // (Damit die Rückseite/Ränder dunkel bleiben)
                color *= iridMask;

                // 6. SPIKE HIGHLIGHTS
                if (vSpike > 0.05) {
                    float shine = dot(fNormal, vec3(0, 1, 0.5));
                    float spikeIntensity = smoothstep(0.0, 1.0, vSpike) * iridMask;
                    vec3 spikeColor = spectral(vSpike + uTime);
                    // Additives Leuchten auf den Spitzen, das das Zebra überlagert
                    color += spikeColor * spikeIntensity * 0.4;
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const overlay = document.getElementById('mobile-overlay');

    if (isMobile) {
        document.getElementById('device-mode').innerText = "System: Mobile";
        overlay.style.display = "flex";

        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            targetInput.x = (t.clientX / window.innerWidth) * 2 - 1;
            targetInput.y = (t.clientY / window.innerHeight) * 2 - 1;
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') startGyro();
            } else { startGyro(); }
        });

        function startGyro() {
            document.getElementById('sensor-status').innerText = "Sensor: Gyro + Touch";
            overlay.remove();
            window.addEventListener('deviceorientation', (e) => {
                targetInput.x = (e.gamma / 40) * CONFIG.gyroSensitivity;
                targetInput.y = ((e.beta - 45) / 40) * CONFIG.gyroSensitivity;
            });
        }
    } else {
        document.getElementById('device-mode').innerText = "System: Desktop";
        document.getElementById('sensor-status').innerText = "Sensor: Mouse Tracking";
        window.addEventListener('mousemove', (e) => {
            targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetInput.y = (e.clientY / window.innerHeight) * 2 - 1;
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        currentInput.x += (targetInput.x - currentInput.x) * CONFIG.lerpFactor;
        currentInput.y += (targetInput.y - currentInput.y) * CONFIG.lerpFactor;
        material.uniforms.uMouse.value.set(currentInput.x, -currentInput.y);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
