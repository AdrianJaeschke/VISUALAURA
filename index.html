<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dual Sphere Tracker - Boldonse Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 30px; left: 30px; color: #00f0ff; 
            font-family: "Boldonse", system-ui; font-size: 13px;
            pointer-events: none; z-index: 100; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        #mobile-overlay {
            position: fixed; inset: 0; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000;
        }
        #start-btn {
            padding: 15px 30px; background: transparent; border: 1px solid #00f0ff;
            color: #00f0ff; font-family: "Boldonse", system-ui;
            font-size: 16px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

<div id="ui">
    <span id="device-mode">System: Detecting</span><br>
    <span id="sensor-status">Sensor: Touch Active</span>
</div>

<div id="mobile-overlay">
    <button id="start-btn">Activate Motion</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        detail: 2,
        spikeSharpness: 25.0,
        maxReach: 1.9,
        stripeDensity: 15.0,
        viewAngle: 25,
        rotationSpeed: 0.005,
        gyroSensitivity: 2.2,
        lerpFactor: 0.05,
        gradientWidth: 0.5,
        gradientStart: 0.2,
        spikeGradientVisibility: 0.9,
        
        // Neue Parameter für die zweite Sphere
        trackerRadius: 1.25, // Halber Durchmesser der originalen Sphere
        showSpikesTracker: false,
        trackerLerp: 0.02    // Etwas langsamer für einen "Ghost"-Effekt
    };

    const angleThreshold = Math.cos(CONFIG.viewAngle * (Math.PI / 180));
    let targetInput = { x: 0, y: 0 };
    let currentInput = { x: 0, y: 0 };
    let trackerPos = new THREE.Vector3(0, 0, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- SHADER LOGIK ---
    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vSpike;
        uniform float uTime;
        uniform vec2 uMouse;
        uniform bool uUseSpikes;

        void main() {
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vec4 pPos = projectionMatrix * mvPos;
            vec2 ndc = pPos.xy / pPos.w;
            float d = distance(ndc, uMouse);
            float influence = smoothstep(0.7, 0.0, d);
            float noise = sin(position.x * 10.0) * cos(position.y * 10.0 + uTime);
            
            vSpike = uUseSpikes ? pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)}) : 0.0;
            
            vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)};
            vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
            vWorldPos = worldPos.xyz;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vSpike;
        uniform float uTime;
        uniform float uThreshold;
        uniform float uGradientStart;
        uniform float uSpikeVis;
        uniform float uOpacity; // Für radiales Ausfaden

        vec3 spectral(float t) {
            return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
        }

        void main() {
            vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
            vec3 viewDir = normalize(cameraPosition - vWorldPos);
            float cameraFacing = dot(fNormal, viewDir);
            
            float stripePattern = sin(vWorldPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0);
            float zebra = step(0.0, stripePattern); 
            vec3 zebraColor = vec3(zebra);
            
            float colorShift = cameraFacing * 0.4 + uTime * 0.2 + vSpike * 0.5;
            vec3 rainbow = spectral(colorShift);
            
            float switchPoint = uThreshold - uGradientStart;
            float switcher = step(switchPoint, cameraFacing + (vSpike * 0.2));
            
            vec3 color = mix(zebraColor, rainbow, switcher);

            if (vSpike > 0.05) {
                float spikeRainbow = step(0.1, vSpike * uSpikeVis);
                color = mix(color, spectral(vSpike + uTime), spikeRainbow * switcher);
            }
            
            gl_FragColor = vec4(color, uOpacity);
        }
    `;

    // --- MATERIALIEN ---
    const mainMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uThreshold: { value: angleThreshold },
            uGradientStart: { value: CONFIG.gradientStart },
            uSpikeVis: { value: CONFIG.spikeGradientVisibility },
            uUseSpikes: { value: true },
            uOpacity: { value: 1.0 }
        },
        vertexShader,
        fragmentShader,
        transparent: true
    });

    const trackerMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uThreshold: { value: angleThreshold },
            uGradientStart: { value: CONFIG.gradientStart },
            uSpikeVis: { value: CONFIG.spikeGradientVisibility },
            uUseSpikes: { value: CONFIG.showSpikesTracker },
            uOpacity: { value: 0.0 }
        },
        vertexShader,
        fragmentShader,
        transparent: true
    });

    // --- MESHES ---
    const geo = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    const mainMesh = new THREE.Mesh(geo, mainMaterial);
    scene.add(mainMesh);

    const trackerGeo = new THREE.IcosahedronGeometry(CONFIG.trackerRadius, CONFIG.detail);
    const trackerMesh = new THREE.Mesh(trackerGeo, trackerMaterial);
    scene.add(trackerMesh);

    // --- INPUT LOGIC ---
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const overlay = document.getElementById('mobile-overlay');

    const updateInput = (x, y) => {
        targetInput.x = (x / window.innerWidth) * 2 - 1;
        targetInput.y = (y / window.innerHeight) * 2 - 1;
    };

    if (isMobile) {
        document.getElementById('device-mode').innerText = "System: Mobile";
        overlay.style.display = "flex";
        window.addEventListener('touchmove', (e) => updateInput(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
        document.getElementById('start-btn').onclick = async () => {
            if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') startGyro();
            } else startGyro();
        };
        function startGyro() {
            document.getElementById('sensor-status').innerText = "Sensor: Gyro + Touch";
            overlay.remove();
            window.addEventListener('deviceorientation', (e) => {
                targetInput.x = (e.gamma / 40) * CONFIG.gyroSensitivity;
                targetInput.y = ((e.beta - 45) / 40) * CONFIG.gyroSensitivity;
            });
        }
    } else {
        document.getElementById('device-mode').innerText = "System: Desktop";
        window.addEventListener('mousemove', (e) => updateInput(e.clientX, e.clientY));
    }

    // --- ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Smoothes Input-Smoothing
        currentInput.x += (targetInput.x - currentInput.x) * CONFIG.lerpFactor;
        currentInput.y += (targetInput.y - currentInput.y) * CONFIG.lerpFactor;

        // Tracker Position berechnen (Weltkoordinaten basierend auf NDC)
        const vector = new THREE.Vector3(currentInput.x, -currentInput.y, 0.5);
        vector.unproject(camera);
        const dir = vector.sub(camera.position).normalize();
        const distance = -camera.position.z / dir.z;
        const pos = camera.position.clone().add(dir.multiplyScalar(distance));
        
        trackerMesh.position.lerp(pos, CONFIG.trackerLerp);

        // Radialer Fade-out der Tracker-Sphere
        // Wir berechnen die Distanz zwischen Main-Sphere (0,0,0) und Tracker
        const distToCenter = trackerMesh.position.length();
        const fadeLimit = CONFIG.radius * 1.5;
        trackerMaterial.uniforms.uOpacity.value = THREE.MathUtils.smoothstep(distToCenter, fadeLimit, CONFIG.radius * 0.5);

        // Uniforms updaten
        mainMaterial.uniforms.uTime.value += 0.02;
        trackerMaterial.uniforms.uTime.value += 0.02;
        mainMaterial.uniforms.uMouse.value.set(currentInput.x, -currentInput.y);
        trackerMaterial.uniforms.uMouse.value.set(currentInput.x, -currentInput.y);

        mainMesh.rotation.y += CONFIG.rotationSpeed;
        trackerMesh.rotation.y -= CONFIG.rotationSpeed * 0.5;

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
