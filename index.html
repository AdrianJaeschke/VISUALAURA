<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Rescue Spike System</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        #overlay {
            position: fixed; top: 10px; left: 10px; color: #00f0ff; 
            font-family: monospace; font-size: 11px; z-index: 100;
            background: rgba(0,0,0,0.7); padding: 8px; border: 1px solid #00f0ff;
        }
    </style>
</head>
<body>

<div id="overlay">
    RENDERER: <span id="r-stat">OFF</span> | 
    MESH: <span id="m-stat">WAIT</span>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // 1. SCENE SETUP (Absolut Standard)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. GEOMETRY (Low Poly)
    const geometry = new THREE.IcosahedronGeometry(2.5, 15);

    // 3. SHADER (Vereinfacht ohne komplexe Noise-Funktionen für maximale Kompatibilität)
    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;

            void main() {
                vNormal = normal;
                
                // Wir nutzen Sinus-Wellen für die Spikes als Fail-Safe (kein Noise)
                float spikeWave = sin(position.x * 5.0 + uTime) * cos(position.y * 5.0 + uTime);
                
                // Distanz-Berechnung zur Maus im NDC Space
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vec4 pPosition = projectionMatrix * mvPosition;
                vec2 ndc = pPosition.xy / pPosition.w;
                float d = distance(ndc, uMouse);
                
                // Lineare Spike-Logik (keine harten Potenzen)
                float influence = smoothstep(0.7, 0.0, d);
                float distortion = spikeWave * influence * uIntensity * 2.0;

                vec3 newPos = position + normal * distortion;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            uniform float uTime;
            void main() {
                // Low Poly Striping
                float stripes = step(0.1, sin(vNormal.y * 20.0 + uTime * 2.0));
                gl_FragColor = vec4(vec3(stripes), 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    document.getElementById('m-stat').innerText = "ADDED";

    // 4. INTERACTION
    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        material.uniforms.uMouse.value.set(x, y);
        material.uniforms.uIntensity.value = 1.0;
    });

    // 5. ANIMATION LOOP
    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.03;
        mesh.rotation.y += 0.005;
        renderer.render(scene, camera);
        document.getElementById('r-stat').innerText = "OK";
    }

    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
