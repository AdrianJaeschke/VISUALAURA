<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Low Poly Iridiscent Spikes</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.9); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui">
    PATTERN: HIGH_CONTRAST_ZEBRA<br>
    GEOMETRY: LOW_POLY_FACETED<br>
    IRIDISCENCE: 25_DEG_LIMIT
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        detail: 30,             // Perfekte Balance für Low-Poly Facetten
        spikeSharpness: 25.0,   // Extrem spitz
        maxReach: 1.9,          
        rotationSpeed: 0.005
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 },
            uRotationY: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vLocalPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;
            uniform float uRotationY;

            mat3 rotateY(float a) {
                return mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
            }

            void main() {
                vLocalPos = position;
                
                // Rotation kompensieren
                vec3 compPos = rotateY(uRotationY) * position;
                
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.65, 0.0, d);
                
                // Spike Logik (Faceted)
                float noise = sin(position.x * 10.0) * cos(position.y * 10.0 + uTime);
                vSpike = pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)});

                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                
                vNormal = normalize(normalMatrix * normal);
                vViewDir = normalize(-mvPos.xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vLocalPos;
            varying float vSpike;
            uniform float uTime;

            // Spektrum für Iridiszenz
            vec3 spectral(float t) {
                return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
            }

            void main() {
                // Erzwungene Low-Poly Normalen (Flat Shading)
                vec3 fNormal = normalize(cross(dFdx(vLocalPos), dFdy(vLocalPos)));
                float angle = dot(fNormal, vViewDir);
                
                // 1. Echt Schwarz-Weißes Zebra (Spherical)
                float phi = atan(vLocalPos.z, vLocalPos.x);
                float stripeValue = sin(phi * 8.0 + vLocalPos.y * 4.0 + uTime);
                float zebra = step(0.0, stripeValue); // Harter Cutoff für S/W
                
                vec3 color = vec3(zebra);

                // 2. 25-Grad Iridiszenz Logik
                // Wenn die Fläche fast direkt zur Kamera schaut
                if (angle > 0.906) {
                    vec3 irid = spectral(angle + vSpike + uTime * 0.2);
                    // Mischung aus Iridiszenz und Zebra
                    color = mix(color, irid, 0.9);
                }

                // 3. Spike-Flächen besonders hervorheben
                if (vSpike > 0.05) {
                    // Eine Seite der Spikes glüht irisierend
                    float spikeFace = dot(fNormal, vec3(0.0, 1.0, 0.5));
                    if(spikeFace > 0.5) {
                        color = mix(color, spectral(vSpike * 3.0 + uTime), vSpike);
                    }
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    window.addEventListener('mousemove', (e) => {
        material.uniforms.uMouse.value.set(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
        );
        material.uniforms.uIntensity.value = 1.0;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        material.uniforms.uRotationY.value = mesh.rotation.y;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
