<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Iridiscent Sticky Spikes</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.8); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="ui">
    System: Stable<br>
    Effect: Iridiscent Fresnel<br>
    Rotation: Compensated
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        detail: 45,             // Höher für weichere Verläufe auf den Spikes
        spikeSharpness: 18.0,   
        maxReach: 1.8,          
        rotationSpeed: 0.005,
        iridIntensity: 0.5      // Stärke des Regenbogen-Effekts
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 },
            uRotationY: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying float vSpikeFactor;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;
            uniform float uRotationY;

            mat3 rotateY(float a) {
                return mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
            }

            void main() {
                // Rotation kompensieren für akkurates Tracking
                vec3 compPos = rotateY(uRotationY) * position;
                
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.7, 0.0, d);
                
                // Fraktales Ausbrechen
                float noise = sin(position.x * 15.0) * cos(position.y * 15.0 + uTime);
                float spike = pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)});
                vSpikeFactor = spike; 

                vec3 newPos = position + normal * spike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                
                vNormal = normalize(normalMatrix * normal);
                vViewDir = normalize(-mvPos.xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying float vSpikeFactor;
            uniform float uTime;

            // Funktion für irisierende Farben (Spektrum)
            vec3 pal( in float t ) {
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.0, 0.33, 0.67);
                return a + b * cos( 6.28318 * (c * t + d) );
            }

            void main() {
                // Low-Poly Shading
                vec3 fNormal = normalize(cross(dFdx(vNormal), dFdy(vNormal)));
                float fresnel = dot(fNormal, vViewDir);
                
                // Irisierender Effekt basierend auf Winkel und Spike-Höhe
                float iridScroll = fresnel + vSpikeFactor * 0.5 + uTime * 0.1;
                vec3 iridColor = pal(iridScroll);
                
                // Zebra-Hintergrund
                float stripes = step(0.1, sin(gl_FragCoord.y * 0.05 + uTime));
                vec3 base = vec3(stripes * 0.2); // Dunkleres Zebra für mehr Kontrast

                // Mix: Je höher der Spike, desto irisierender
                vec3 finalColor = mix(base, iridColor, vSpikeFactor + (1.0 - fresnel) * ${CONFIG.iridIntensity.toFixed(1)});
                
                // Glanzlicht an der Spitze
                if(fresnel > 0.92) finalColor += vec3(0.2);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    window.addEventListener('mousemove', (e) => {
        material.uniforms.uMouse.value.set(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
        );
        material.uniforms.uIntensity.value = 1.0;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        material.uniforms.uRotationY.value = mesh.rotation.y;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
