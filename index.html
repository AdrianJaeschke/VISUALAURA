<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stachel-Magnet-Sphäre</title>
   <style>
    /* Der Cursor wird hier für den gesamten Screen und das Canvas erzwungen */
    body, html { 
        margin: 0; 
        padding: 0;
        overflow: hidden; 
        background: #000; 
        cursor: crosshair !important; /* Erzwingt das Fadenkreuz */
    }
    
    canvas { 
        display: block; 
        cursor: crosshair !important; /* Sicherstellung für das WebGL-Element */
    }

    #ui-hint {
        position: fixed; 
        top: 20px; 
        left: 20px; 
        color: #00f0ff; 
        font-family: 'Courier New', monospace; 
        pointer-events: none;
        background: rgba(0, 240, 255, 0.1); 
        padding: 10px; 
        border-radius: 5px;
        z-index: 100;
    }
</style>
</head>
<body>
<div id="ui-hint">MAGNET-ZONE: 75% | STATUS: BEREIT</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // ANPASSBARE PARAMETER (CONFIG)
    // ==========================================
    const CONFIG = {
        sphereRadius: 2.5,
        detail: 50,             // Höher = mehr/feinere Spikes (Performance-Lastig)
        activationRadius: 0.75,  // Ab wann die Maus reagiert (0.0 bis 1.0)
        maxSpikeLength: 4.0,    // Wie weit die Stacheln schießen
        spikeSharpness: 2.0,    // Höher = dünnere, nadelartige Spitzen
        rotationSpeed: 0.005,
        irisAngle: 0.806        // 25 Grad für Farbverlauf (cos-Wert)
    };

    // ==========================================
    // SHADER QUELLCODE
    // ==========================================
    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;
        uniform float uIntensity; // Stärke der magnetischen Anziehung
        uniform vec2 uMouse;      // Mausposition (-1 bis 1)

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            
            // Richtungsvektor zur Maus (Maus schwebt auf z=5 Ebene)
            vec3 mousePos3D = vec3(uMouse * 8.0, 5.0); 
            vec3 dirToMouse = normalize(mousePos3D - worldPos.xyz);
            
            // Berechne, wie sehr diese Seite zur Maus schaut
            float attraction = max(0.0, dot(normalize(worldPos.xyz), dirToMouse));
            
            // STACHEL-LOGIK:
            // Nur auf der Mausseite (attraction > 0)
            // Wir potenzieren die Attraction, um die Spitzen schmaler zu machen
            // uIntensity steuert die Gesamtlänge
            float spikes = pow(attraction, ${CONFIG.spikeSharpness.toFixed(1)}) * uIntensity * ${CONFIG.maxSpikeLength.toFixed(1)};
            
            // Versetze die Scheitelpunkte entlang der Normalen
            vec3 newPos = position + normal * spikes;
            
            vWorldPosition = (modelMatrix * vec4(newPos, 1.0)).xyz;
            vViewPosition = (modelViewMatrix * vec4(newPos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;

        void main() {
            // Harte Kanten für Low-Poly Look
            vec3 fNormal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));
            vec3 viewDir = normalize(-vViewPosition);
            float angle = dot(fNormal, viewDir);
            
            vec3 finalColor;
            
            // 25 Grad Farb-Check
            if (angle > ${CONFIG.irisAngle.toFixed(3)}) {
                // Iridiszenz (Cyan/Magenta)
                float flow = sin(angle * 15.0 + uTime * 4.0) * 0.5 + 0.5;
                finalColor = mix(vec3(0.0, 1.0, 1.0), vec3(1.0, 0.0, 1.0), flow);
            } else {
                // Zebra-Muster auf allen anderen Flächen
                float stripes = sin(vWorldPosition.y * 12.0 + vWorldPosition.x * 6.0 + uTime * 5.0);
                finalColor = vec3(step(0.05, stripes));
            }
            
            gl_FragColor = vec4(finalColor, 1.0);
        }
    `;

    // ==========================================
    // MAIN ENGINE SETUP
    // ==========================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Geometrie mit hoher Unterteilung für viele kleine Spikes
    const geometry = new THREE.IcosahedronGeometry(CONFIG.sphereRadius, CONFIG.detail);
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) }
        },
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    camera.position.z = 10;

    let targetIntensity = 0;

    // Maus-Interaktion
    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        material.uniforms.uMouse.value.set(x, y);

        const dist = Math.sqrt(x*x + y*y);

        // Aktiviere nur innerhalb des 75% Radius
        if (dist < CONFIG.activationRadius) {
            // Intensität steigt, je näher man der Mitte kommt
            targetIntensity = (CONFIG.activationRadius - dist) * 2.0;
        } else {
            targetIntensity = 0;
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        
        material.uniforms.uTime.value += 0.015;
        
        // Sanftes Aus- und Einfahren der Stacheln (Interpolation)
        material.uniforms.uIntensity.value += (targetIntensity - material.uniforms.uIntensity.value) * 0.1;
        
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }

    // Resize Handling
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
