<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Aura Skulptur</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; touch-action: none; }
        canvas { display: block; }
        #status-box {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px; padding: 15px 25px; color: #00f0ff; 
            font-family: 'Segoe UI', monospace; font-size: 13px; letter-spacing: 1px;
            text-align: center; z-index: 1000; pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

<div id="status-box">SYSTEM INITIALISIEREN...</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- SHADER LOGIK (Simplex Noise & Iridiszenz) ---
    const vertexShader = `
        varying vec3 vNormal;
        varying float vNoise;
        uniform float uTime;
        uniform float uIntensity;

        // Simplex 3D Noise Funktion
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            // Noise-Wert basierend auf Position und Zeit
            vNoise = snoise(position * 0.4 + uTime * 0.3);
            
            // Verformung entlang der Normalen (Aura-Effekt)
            vec3 newPos = position + normal * vNoise * uIntensity;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying float vNoise;
        uniform float uTime;

        void main() {
            // Hartes Shading für Low-Poly Look simulieren
            vec3 fNormal = normalize(cross(dFdx(vNormal), dFdy(vNormal)));
            float light = dot(fNormal, vec3(0.0, 0.0, 1.0)) * 0.5 + 0.5;

            // Farben: Cyan, Magenta und ein leuchtendes Gelb/Grün
            vec3 c1 = vec3(0.0, 1.0, 1.0);
            vec3 c2 = vec3(1.0, 0.0, 1.0);
            
            float colorMix = vNoise * 0.5 + 0.5;
            vec3 finalColor = mix(c1, c2, colorMix);
            
            // Zeit-basierte Farbverschiebung (Iridiszenz)
            finalColor.rgb += 0.2 * sin(uTime + vNoise * 10.0);

            gl_FragColor = vec4(finalColor * (0.8 + light * 0.4), 1.0);
        }
    `;

    // --- SETUP ---
    let scene, camera, renderer, mesh, material;
    let targetIntensity = 1.2; // Startwert erhöht für Sichtbarkeit
    const statusBox = document.getElementById('status-box');

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6; // Näher ran

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Geometrie: Icosahedron für gute Low-Poly Struktur
        const geometry = new THREE.IcosahedronGeometry(2.5, 15);
        
        material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uIntensity: { value: 1.2 }
            },
            flatShading: true,
            side: THREE.DoubleSide
        });

        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        animate();
        setupInteraction();
    }

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.015;
        
        // Intensität glätten
        material.uniforms.uIntensity.value += (targetIntensity - material.uniforms.uIntensity.value) * 0.05;
        
        mesh.rotation.y += 0.003;
        renderer.render(scene, camera);
    }

    function setupInteraction() {
        // Desktop: Maus
        window.addEventListener('mousemove', (e) => {
            targetIntensity = (1.0 - (e.clientY / window.innerHeight)) * 2.5;
        });

        // Mobile: Gyroskop
        const activateGyro = () => {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta !== null) {
                    let tilt = Math.abs(e.beta) + Math.abs(e.gamma);
                    targetIntensity = (tilt / 90.0) * 2.0;
                }
            });
            statusBox.innerHTML = "AURA AKTIV ✓";
            setTimeout(() => statusBox.style.opacity = '0.3', 2000);
        };

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            statusBox.innerHTML = "BITTE TIPPEN FÜR SENSOR-START";
            window.addEventListener('click', () => {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') activateGyro();
                });
            }, { once: true });
        } else {
            activateGyro();
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
