<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mobile Low-Poly Spike Sphere</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 15, 25, 0.9); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }

        #gyro-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s ease;
        }

        #gyro-button {
            padding: 20px 40px; background: none; border: 2px solid #00f0ff;
            color: #00f0ff; font-family: 'Courier New', monospace;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>

<div id="ui">
    SYSTEM: <span id="status">WAITING</span><br>
    GEOMETRY: LOW_POLY_ICOSA<br>
    PATTERN: STABLE_PLANAR
</div>

<div id="gyro-overlay">
    <button id="gyro-button">Initialize Neural Link</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // VOLLSTÄNDIGE KONFIGURATIONSLISTE
    // ==========================================
    const CONFIG = {
        // Geometrie
        radius: 2.5,
        detail: 2,              // 1-3 für harten Low-Poly Look
        
        // Spikes
        spikeSharpness: 25.0,
        maxReach: 1.9,
        
        // Zebra & Optik
        stripeDensity: 15.0,    // Keine Pol-Verzerrung durch planare Projektion
        viewAngle: 25,          // Kamera-Logik: Schwellenwert in Grad
        
        // Bewegung & Animation
        rotationSpeed: 0.005,
        gyroSensitivity: 1.8,
        iridSpeed: 0.3
    };

    // Berechnung des Dot-Product Schwellenwerts aus dem Winkel
    const angleThreshold = Math.cos(CONFIG.viewAngle * (Math.PI / 180));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 },
            uRotationY: { value: 0 },
            uThreshold: { value: angleThreshold }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;
            uniform float uRotationY;

            mat3 rotateY(float a) {
                return mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
            }

            void main() {
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.65, 0.0, d);
                
                float noise = sin(position.x * 10.0) * cos(position.y * 10.0 + uTime);
                vSpike = pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)});

                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                vViewDir = normalize(cameraPosition - vWorldPos);
                
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform float uThreshold;

            vec3 spectral(float t) {
                return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
            }

            void main() {
                // Low-Poly Shading
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                float cameraFacing = dot(fNormal, vViewDir);
                
                // Zebra: Planare Projektion (Schwarz-Weiß harten Kontrast)
                float stripePattern = sin(vWorldPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0);
                float zebra = step(0.0, stripePattern);
                
                vec3 color = vec3(zebra);

                // 25 Grad Iridiszenz von der Kamera aus
                if (cameraFacing > uThreshold) {
                    float shift = (cameraFacing - uThreshold) / (1.0 - uThreshold);
                    vec3 irid = spectral(shift + uTime * ${CONFIG.iridSpeed.toFixed(1)} + vSpike);
                    color = mix(color, irid, shift);
                }

                // Low-Poly Spike Highlight
                if (vSpike > 0.1) {
                    float spikeFace = dot(fNormal, vec3(0.0, 1.0, 0.5));
                    if(spikeFace > 0.4) {
                        color = mix(color, spectral(vSpike + uTime), vSpike);
                    }
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    // --- MOBILE / GYRO HANDLER ---
    const overlay = document.getElementById('gyro-overlay');
    const statusText = document.getElementById('status');

    document.getElementById('gyro-button').addEventListener('click', async () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', (e) => {
                        const x = (e.gamma / 45) * CONFIG.gyroSensitivity;
                        const y = ((e.beta - 45) / 45) * CONFIG.gyroSensitivity;
                        material.uniforms.uMouse.value.set(
                            THREE.MathUtils.clamp(x, -1, 1),
                            THREE.MathUtils.clamp(-y, -1, 1)
                        );
                    });
                    statusText.innerText = 'GYRO_ACTIVE';
                }
            } catch (e) { console.error(e); }
        } else {
            // Android / Desktop Fallback
            window.addEventListener('deviceorientation', (e) => {
                const x = (e.gamma / 45) * CONFIG.gyroSensitivity;
                const y = ((e.beta - 45) / 45) * CONFIG.gyroSensitivity;
                material.uniforms.uMouse.value.set(THREE.MathUtils.clamp(x, -1, 1), THREE.MathUtils.clamp(-y, -1, 1));
            });
            statusText.innerText = 'SENSOR_ACTIVE';
        }
        
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 500);
        material.uniforms.uIntensity.value = 1.0;
    });

    // Maus-Fallback
    window.addEventListener('mousemove', (e) => {
        if (statusText.innerText === 'WAITING') {
            material.uniforms.uMouse.value.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            material.uniforms.uIntensity.value = 1.0;
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        material.uniforms.uRotationY.value = mesh.rotation.y;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
