<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Precision Spike Sphere</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        
        #ui-layer {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.8); padding: 10px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }

        #mouse-tag {
            position: fixed; pointer-events: none; color: #00f0ff;
            font-family: 'Courier New', monospace; font-size: 9px;
            text-shadow: 0 0 5px #00f0ff; z-index: 1000;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    SYSTEM: STABLE<br>
    SHADER: IRIDISCENT_FRACTAL<br>
    ANGLE_LIMIT: 25°
</div>

<div id="mouse-tag">X: 0.00 | Y: 0.00</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 9;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- SHADER LOGIK ---
    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                vViewDir = normalize(- (modelViewMatrix * vec4(position, 1.0)).xyz);

                // Spike-Projektion
                vec4 screenPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                vec2 ndc = screenPos.xy / screenPos.w;
                float dist = distance(ndc, uMouse);

                // Fraktaler Look via Sinus-Schichtung (stabiler als Noise)
                float f = sin(position.x * 10.0 + uTime) * cos(position.y * 10.0 + uTime);
                f += sin(position.z * 20.0) * 0.5;
                
                float influence = smoothstep(0.8, 0.0, dist);
                // Hyperbel-artige Zuspitzung
                float distortion = pow(max(0.0, f), 8.0) * influence * uIntensity * 4.0;

                vec3 newPos = position + normal * distortion;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            uniform float uTime;

            void main() {
                // Hard-Shading für Low-Poly Look
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                float angle = dot(fNormal, vViewDir);
                
                vec3 color;
                // 25 Grad Iridiszenz-Check (cos(25°) ≈ 0.906)
                if (angle > 0.906) {
                    float flow = sin(uTime * 4.0) * 0.5 + 0.5;
                    color = mix(vec3(0.0, 1.0, 1.0), vec3(1.0, 0.0, 1.0), flow);
                } else {
                    float stripes = step(0.1, sin(vWorldPos.y * 12.0 + uTime * 2.0));
                    color = vec3(stripes);
                }
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 20), material);
    scene.add(mesh);

    // --- INTERACTION & UI ---
    const mouseTag = document.getElementById('mouse-tag');

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        material.uniforms.uMouse.value.set(x, y);
        material.uniforms.uIntensity.value = 1.0;

        // Label-Position
        mouseTag.style.left = (e.clientX + 15) + 'px';
        mouseTag.style.top = (e.clientY + 15) + 'px';
        mouseTag.innerText = `X: ${x.toFixed(2)} | Y: ${y.toFixed(2)}`;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += 0.003;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
