<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Iridisierende Aura</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; touch-action: none; }
        canvas { display: block; }
        /* Deine Status-Box bleibt */
        #status-box {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
            padding: 12px 20px; color: #00f0ff; font-family: sans-serif; font-size: 14px;
            text-align: center; transition: opacity 0.5s ease; z-index: 1000; pointer-events: none;
        }
        .error { color: #ff0055 !important; border-color: rgba(255, 0, 85, 0.3) !important; }
    </style>
</head>
<body>

<div id="status-box">Initialisiere...</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Variablen & Setup ---
    let targetRotX = -Math.PI / 4, targetRotY = 0;
    const statusBox = document.getElementById('status-box');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Geometrie (Hohe Auflösung für Zacken) ---
    const geometry = new THREE.PlaneGeometry(12, 12, 128, 128); // Auflösung erhöhen
    
    // ==========================================
    // NEU: Iridisierendes Physikalisch Korrektes Material
    // ==========================================
    const material = new THREE.MeshPhysicalMaterial({
        color: 0x1a1a1a, // Grundfarbe dunkel
        metalness: 0.9,  // Metallisch für Glanz
        roughness: 0.1,  // Glatt für scharfe Reflexionen
        
        // Iridiszenz-Einstellungen (Das ist der Schlüssel!)
        iridescence: 1.0, 
        iridescenceIOR: 1.3, // Brechungsindex
        iridescenceThicknessRange: [100, 400], // Schichtdicke
        
        flatShading: true, // Wichtig für den Low-Poly-Look
        side: THREE.DoubleSide
    });

    const sculpture = new THREE.Mesh(geometry, material);
    sculpture.rotation.x = targetRotX;
    scene.add(sculpture);

    // ==========================================
    // NEU: Beleuchtung für Iridiszenz hinzufügen
    // ==========================================
    // Zwei Punktlichter, um die Skulptur zu beleuchten und den Effekt auszulösen
    const pointLight1 = new THREE.PointLight(0xff00ff, 15, 50); // Magenta
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x00ffff, 15, 50); // Cyan
    pointLight2.position.set(-5, -5, 5);
    scene.add(pointLight2);

    // Umgebungslicht für Grundhelligkeit
    const ambientLight = new THREE.AmbientLight(0x111111);
    scene.add(ambientLight);

    camera.position.z = 10;

    // --- Mandelbrot Deformation Logik ---
    function updateMandelbrot() {
        const pos = geometry.attributes.position;
        const zoom = 2.2, offX = -0.5;

        for (let i = 0; i < pos.count; i++) {
            let x0 = (pos.getX(i) * (1/zoom)) + offX, y0 = (pos.getY(i) * (1/zoom));
            let x = 0, y = 0, iter = 0, maxIter = 32;
            while (x*x + y*y <= 4 && iter < maxIter) {
                let xtemp = x*x - y*y + x0; y = 2*x*y + y0; x = xtemp; iter++;
            }
            // Z-Achse verformen für die Zacken
            pos.setZ(i, iter * 0.2); 
        }
        pos.needsUpdate = true;
        // WICHTIG: Normale neu berechnen, sonst stimmt die Beleuchtung nicht
        geometry.computeVertexNormals();
    }
    updateMandelbrot();

    // --- Animation Loop (Beleuchtung mit-animieren) ---
    function animate() {
        requestAnimationFrame(animate);

        // Sanfte Rotation
        sculpture.rotation.x += (targetRotX - sculpture.rotation.x) * 0.08;
        sculpture.rotation.y += (targetRotY - sculpture.rotation.y) * 0.08;

        // Lichter bewegen sich leicht, um die Iridiszenz zu betonen
        const t = Date.now() * 0.001;
        pointLight1.position.x = 5 + Math.sin(t) * 2;
        pointLight1.position.z = 5 + Math.cos(t) * 2;
        pointLight2.position.y = -5 + Math.cos(t * 1.3) * 2;

        renderer.render(scene, camera);
    }
    animate();

    // --- Input & Status Logic (Deine bestehende Logik) ---
    function updateStatus(msg, isError = false) {
        statusBox.innerHTML = msg;
        if (isError) statusBox.classList.add('error');
        else statusBox.classList.remove('error');
        statusBox.style.opacity = '1';
        setTimeout(() => statusBox.style.opacity = '0.3', 3000);
    }

    const activateGyro = () => {
        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null) {
                targetRotX = (e.beta / 180 * Math.PI) - Math.PI / 4;
                targetRotY = (e.gamma / 90 * Math.PI);
            }
        }, true);
        updateStatus("Gyroskop aktiv ✓");
    };

    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        updateStatus("Bitte tippen für Sensor-Aktivierung...");
        window.addEventListener('click', function handler() {
            DeviceOrientationEvent.requestPermission().then(s => s==='granted'?activateGyro():updateStatus("Verweigert", true));
            window.removeEventListener('click', handler);
        }, { once: true });
    } else if (window.DeviceOrientationEvent) { activateGyro(); }
    else { updateStatus("Kein Gyro - Nutze Maus"); window.addEventListener('mousemove', (e) => {
        targetRotY = (e.clientX / window.innerWidth - 0.5) * 1.5;
        targetRotX = (e.clientY / window.innerHeight - 0.5) * 1.5 - Math.PI/4;
    });}

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

</script>
</body>
</html>
