<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fixed Spike Interaction</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        #debug {
            position: fixed; top: 10px; left: 10px; color: #00f0ff; 
            font-family: monospace; font-size: 11px;
            background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00f0ff;
        }
        #cursor-info {
            position: fixed; pointer-events: none; color: #00f0ff;
            font-family: monospace; font-size: 10px; z-index: 100;
        }
    </style>
</head>
<body>

<div id="debug">
    STATUS: <span id="s-stat">LOAD</span> | 
    INTENSITY: <span id="s-int">0</span>
</div>
<div id="cursor-info">X:0 Y:0</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- PARAMETER ---
    const CONFIG = {
        detail: 20,          // LOW POLY
        spikeCount: 15.0,    // FRAKTAL
        reach: 5.0,          // MAX LÄNGE
        sharpness: 12.0      // SPITZIGKEIT
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- SHADER ---
    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform vec2 uMouse; // Wir nutzen direkt 2D Mouse NDC
        uniform float uIntensity;

        // Schneller Noise
        float hash(vec3 p) {
            p = fract(p * 0.3183099 + 0.1);
            p *= 17.0;
            return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 wPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = wPos.xyz;

            // Einfache 2D Distanz für Spikes (Maus zu Screen-Projektion)
            vec4 screenPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vec2 ndcPos = screenPos.xy / screenPos.w;
            float dist = distance(ndcPos, uMouse);

            // Fraktaler Spike-Aufbruch
            float n = hash(position * ${CONFIG.spikeCount.toFixed(1)} + uTime * 0.1);
            float mask = smoothstep(0.8, 0.0, dist);
            float spikes = pow(max(0.0, n), ${CONFIG.sharpness.toFixed(1)}) * mask * uIntensity;

            vec3 newPos = position + normal * spikes * ${CONFIG.reach.toFixed(1)};
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vWorldPos;
        uniform float uTime;
        void main() {
            float s = step(0.1, sin(vWorldPos.y * 12.0 + uTime * 3.0));
            gl_FragColor = vec4(vec3(s), 1.0);
        }
    `;

    const material = new THREE.ShaderMaterial({
        vertexShader, fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) }
        }
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, CONFIG.detail), material);
    scene.add(mesh);
    camera.position.z = 10;

    // --- INTERACTION ---
    const mouseInfo = document.getElementById('cursor-info');
    const intDisp = document.getElementById('s-int');

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        material.uniforms.uMouse.value.set(x, y);
        material.uniforms.uIntensity.value = 1.0; // Immer aktiv zum Testen!

        mouseInfo.style.left = (e.clientX + 15) + 'px';
        mouseInfo.style.top = (e.clientY + 15) + 'px';
        mouseInfo.innerText = \`X: \${x.toFixed(2)} | Y: \${y.toFixed(2)}\`;
        intDisp.innerText = "1.0";
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += 0.005;
        renderer.render(scene, camera);
    }
    document.getElementById('s-stat').innerText = "STABLE";
    animate();
</script>
</body>
</html>
