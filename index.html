<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Spike Precision V2</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        
        /* Status-Meldungen oben links */
        #status-panel {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.8); padding: 10px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100; line-height: 1.4;
        }

        /* Mouse-Koordinaten direkt am Cursor */
        #mouse-coords {
            position: fixed; pointer-events: none; color: #00f0ff;
            font-family: 'Courier New', monospace; font-size: 9px;
            text-shadow: 0 0 5px #00f0ff; z-index: 1000;
            white-space: nowrap; transition: opacity 0.2s;
        }

        .error { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>

<div id="status-panel">
    <div>SYSTEM: <span id="sys-status">INITIALIZING...</span></div>
    <div>INTERACTION: <span id="int-status">IDLE</span></div>
    <div>SPIKES: <span id="spike-count">0</span></div>
</div>

<div id="mouse-coords">X: 0.00 | Y: 0.00</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // CONFIG & PARAMETER
    // ==========================================
    const CONFIG = {
        radius: 2.5,
        detail: 15,             // LOW POLY (10-20)
        spikeFreq: 12.0,        // FRAKTAL: Dichte der Ausbrüche
        spikeSharpness: 10.0,   // Wie spitz/hyperbelartig
        maxReach: 4.5,          // Länge
        activationDist: 6.0,    // Interaktionsradius im 3D Raum
        rotationSpeed: 0.005
    };

    const statusEl = document.getElementById('sys-status');
    const intEl = document.getElementById('int-status');
    const coordEl = document.getElementById('mouse-coords');
    const spikeEl = document.getElementById('spike-count');

    // Shader mit fraktaler Noise-Logik
    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        uniform float uTime;
        uniform float uIntensity;
        uniform vec3 uMouseWorld;

        // Simplex Noise
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            return 42.0 * dot(m*m*m*m, vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)));
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            
            float dist = distance(worldPos.xyz, uMouseWorld);
            float noise = snoise(position * ${CONFIG.spikeFreq.toFixed(1)} + uTime * 0.2);
            
            // Maske für die Aktivierung
            float mask = smoothstep(${CONFIG.activationDist.toFixed(1)}, 0.0, dist);
            float spikePower = pow(max(0.0, noise), ${CONFIG.spikeSharpness.toFixed(1)}) * mask * uIntensity;
            
            vec3 newPos = position + normal * spikePower * ${CONFIG.maxReach.toFixed(1)};
            
            vWorldPosition = (modelMatrix * vec4(newPos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        uniform float uTime;
        void main() {
            vec3 fNormal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));
            float stripes = step(0.1, sin(vWorldPosition.y * 10.0 + uTime * 2.0));
            gl_FragColor = vec4(vec3(stripes), 1.0);
        }
    `;

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    const material = new THREE.ShaderMaterial({
        vertexShader, fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 },
            uMouseWorld: { value: new THREE.Vector3(10, 10, 10) }
        }
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    camera.position.z = 10;

    // --- INTERACTION LOGIC ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectPoint = new THREE.Vector3();

    window.addEventListener('mousemove', (e) => {
        // UI Update: Koordinaten am Cursor
        coordEl.style.left = (e.clientX + 15) + 'px';
        coordEl.style.top = (e.clientY + 15) + 'px';
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        coordEl.innerText = `X: ${mouse.x.toFixed(2)} | Y: ${mouse.y.toFixed(2)}`;

        // Raycasting für 3D-Position
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(interactionPlane, intersectPoint)) {
            material.uniforms.uMouseWorld.value.copy(intersectPoint);
            
            const d = intersectPoint.length();
            if (d < 8) {
                material.uniforms.uIntensity.value = 1.0;
                intEl.innerText = "ACTIVE";
                intEl.style.color = "#00f0ff";
            } else {
                material.uniforms.uIntensity.value = 0.0;
                intEl.innerText = "IDLE";
                intEl.style.color = "#aaa";
            }
        }
    });

    // Error Handling & Status
    window.onerror = (msg) => {
        statusEl.innerText = "ERROR";
        statusEl.className = "error";
        console.error(msg);
    };

    function animate() {
        requestAnimationFrame(animate);
        try {
            material.uniforms.uTime.value += 0.02;
            mesh.rotation.y += CONFIG.rotationSpeed;
            
            // Simuliere Spike-Count Anzeige (basierend auf Intensität)
            spikeEl.innerText = Math.floor(material.uniforms.uIntensity.value * 154);
            
            if(statusEl.innerText !== "ERROR") statusEl.innerText = "STABLE";
            
            renderer.render(scene, camera);
        } catch (e) {
            statusEl.innerText = "SHADER_FAIL";
            statusEl.className = "error";
        }
    }

    statusEl.innerText = "RUNNING";
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
