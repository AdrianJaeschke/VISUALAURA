<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shield Fix - Force Visible</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: monospace; font-size: 11px; z-index: 100;
            pointer-events: none;
        }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        button {
            padding: 20px 40px; background: transparent; border: 2px solid #00f0ff;
            color: #00f0ff; cursor: pointer; font-family: monospace; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="ui">SYSTEM: ONLINE<br>STATUS: <span id="status">WAITING</span></div>
<div id="overlay"><button id="start">ACTIVATE SHIELD</button></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- PARAMETER ---
    const CONFIG = {
        radius: 2.5,
        ghostRadius: 2.8,         // Etwas kleinerer Abstand für bessere Stabilität
        detail: 3,
        stripeDensity: 12.0,
        shieldSize: 0.5,          
        shieldSharpness: 0.1,    
        lerpFactor: 0.2
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0.3, 0.3); // Start-Position damit es sichtbar ist!
    let currentInput = new THREE.Vector2(0.3, 0.3);

    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 pPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    // INNERE KUGEL
    const innerMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            void main() {
                float zebra = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0));
                float fres = pow(1.0 - abs(vNormal.z), 1.5);
                vec3 col = mix(vec3(zebra), vec3(0.8, 0.2, 1.0), fres);
                gl_FragColor = vec4(col, 1.0);
            }
        `
    });

    // SCHUTZSCHILD (OHNE DISCARD)
    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0.3, 0.3) },
            uAspect: { value: window.innerWidth / window.innerHeight }
        },
        transparent: true,
        depthTest: false, // Schild wird IMMER über der Kugel gezeichnet
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            uniform vec2 uMouse;
            uniform float uAspect;
            uniform float uTime;
            void main() {
                vec2 diff = vScreenPos - uMouse;
                diff.x *= uAspect;
                float dist = length(diff);
                
                // Maske steuert nur die Deckkraft
                float mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, dist);
                
                vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.4) + vec3(0, 0.33, 0.67)));
                
                // Wir nutzen mask als Alpha, aber lassen einen minimalen Schimmer (0.05)
                gl_FragColor = vec4(irid, max(mask, 0.0) * 1.0);
            }
        `
    });

    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), innerMat);
    scene.add(inner);

    const ghost = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail), shieldMat);
    scene.add(ghost);

    // --- TOUCH FIX ---
    const update = (x, y) => {
        targetInput.x = (x / window.innerWidth) * 2 - 1;
        targetInput.y = -(y / window.innerHeight) * 2 + 1;
        document.getElementById('status').innerText = `X: ${targetInput.x.toFixed(2)} Y: ${targetInput.y.toFixed(2)}`;
    };

    document.getElementById('start').onclick = () => {
        document.getElementById('overlay').style.display = 'none';
        
        // Maus
        window.addEventListener('mousemove', (e) => update(e.clientX, e.clientY));
        
        // Touch
        window.addEventListener('touchstart', (e) => update(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            update(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        const time = performance.now() * 0.001;
        innerMat.uniforms.uTime.value = time;
        shieldMat.uniforms.uTime.value = time;
        shieldMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += 0.005;
        // Das Schild rotiert leicht mit dem Input
        ghost.rotation.set(-currentInput.y * 0.5, currentInput.x * 0.5, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = camera.aspect;
    };
</script>
</body>
</html>
