<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Precision Fractal Sphere</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        
        #ui-layer {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.8); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }

        #mouse-tag {
            position: fixed; pointer-events: none; color: #00f0ff;
            font-family: 'Courier New', monospace; font-size: 9px;
            text-shadow: 0 0 5px #00f0ff; z-index: 1000;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    SYSTEM: ONLINE<br>
    MODE: LOW_POLY_FRACTAL<br>
    STATUS: IRIDISCENT_SPIKES
</div>

<div id="mouse-tag">X: 0.00 | Y: 0.00</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // ANPASSBARE PARAMETER (CONFIG)
    // ==========================================
    const CONFIG = {
        radius: 2.5,
        detail: 30,             // Höherer Wert für feinere Spike-Flanken
        spikeFreq: 18.0,        
        spikeSharpness: 12.0,   
        maxReach: 1.5,          
        activationRange: 0.85,  
        rotationSpeed: 0.003
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 9;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                
                // Blickrichtung von der Kamera zum Vertex im Weltraum
                vViewDir = normalize(cameraPosition - vWorldPos);

                vec4 screenPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                vec2 ndc = screenPos.xy / screenPos.w;
                float dist = distance(ndc, uMouse);

                // Fraktaler Noise-Ersatz
                float f = sin(position.x * ${CONFIG.spikeFreq.toFixed(1)} + uTime) * 
                          cos(position.y * ${CONFIG.spikeFreq.toFixed(1)} + uTime) *
                          sin(position.z * 5.0);
                
                float influence = smoothstep(${CONFIG.activationRange.toFixed(1)}, 0.0, dist);
                float distortion = pow(max(0.0, f), ${CONFIG.spikeSharpness.toFixed(1)}) * 
                                   influence * uIntensity * ${CONFIG.maxReach.toFixed(1)};

                vec3 newPos = position + normal * distortion;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            uniform float uTime;

            void main() {
                // Präzises Low-Poly Face-Normal
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                
                // Dot-Produkt: 1.0 wenn Fläche direkt zur Kamera schaut, 0.0 wenn 90 Grad
                float cameraFacing = dot(fNormal, vViewDir);
                
                vec3 color;
                
                // Schwellenwert für den Iridiszenz-Verlauf (ca. 25-30 Grad)
                if (cameraFacing > 0.88) {
                    // Zeitbasierter Farbwechsel zwischen Cyan und Violett
                    float hueShift = sin(uTime * 3.0 + cameraFacing * 5.0) * 0.5 + 0.5;
                    vec3 glowColor = mix(vec3(0.0, 1.0, 1.0), vec3(0.5, 0.0, 1.0), hueShift);
                    
                    // Sanfter Verlauf basierend auf der exakten Ausrichtung zur Kamera
                    color = mix(vec3(1.0), glowColor, smoothstep(0.88, 1.0, cameraFacing));
                } else {
                    // Klassisches Zebra-Muster für die Seitenflächen
                    float stripes = step(0.15, sin(vWorldPos.y * 15.0 + uTime * 2.0));
                    color = vec3(stripes);
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    const mouseTag = document.getElementById('mouse-tag');

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        material.uniforms.uMouse.value.set(x, y);
        material.uniforms.uIntensity.value = 1.0;

        mouseTag.style.left = (e.clientX + 15) + 'px';
        mouseTag.style.top = (e.clientY + 15) + 'px';
        mouseTag.innerText = `X: ${x.toFixed(2)} | Y: ${y.toFixed(2)}`;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
