<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shield Sphere Hybrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 30px; left: 30px; color: #00f0ff; 
            font-family: "Boldonse", system-ui; font-size: 13px;
            pointer-events: none; z-index: 100; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

<div id="ui">
    <span id="device-mode">System: Detecting</span><br>
    <span id="sensor-status">Sensor: Active</span>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 3.0, // Größe auf 3 erhöht
        detail: 2,
        spikeSharpness: 25.0,
        maxReach: 1.9,
        stripeDensity: 15.0,
        viewAngle: 25,
        rotationSpeed: 0.005,
        lerpFactor: 0.05,
        ghostRotationStrength: 1.2,
        shieldRadius: 0.8 // Radius des sichtbaren Bereichs um die Maus
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    let targetInput = { x: 0, y: 0 };
    let currentInput = { x: 0, y: 0 };

    // --- SHADER: INITIAL SPHERE (Zebra) ---
    const mainMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(0, 0) }, uThreshold: { value: Math.cos(CONFIG.viewAngle * Math.PI / 180) } },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            void main() {
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.7, 0.0, d);
                vSpike = pow(max(0.0, influence + sin(position.x * 10.0) * 0.3), ${CONFIG.spikeSharpness});
                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach};
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vWorldPos = worldPos.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform float uThreshold;
            void main() {
                vec3 viewDir = normalize(cameraPosition - vWorldPos);
                float cameraFacing = dot(normalize(vNormal), viewDir);
                float zebra = step(0.0, sin(vWorldPos.y * ${CONFIG.stripeDensity} + uTime * 2.0));
                float switcher = step(uThreshold - 0.2, cameraFacing + vSpike);
                vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (cameraFacing * 0.5 + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                gl_FragColor = vec4(mix(vec3(zebra), rainbow, switcher), 1.0);
            }
        `
    });

    // --- SHADER: GHOST SHIELD (Outline Weiß + Füllung Irisierend + Radial Fade) ---
    const ghostMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uShieldRadius: { value: CONFIG.shieldRadius }
        },
        transparent: true,
        vertexShader: `
            varying vec3 vNormal;
            varying vec2 vUv;
            varying vec2 vMouseDist;
            uniform vec2 uMouse;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                // Distanz zur Maus im Screen-Space für den Fade-Effekt
                vMouseDist = (pPos.xy / pPos.w) - uMouse;
                gl_Position = pPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec2 vMouseDist;
            uniform float uTime;
            uniform float uShieldRadius;

            void main() {
                // Radialer Fade vom Mauszeiger aus
                float dist = length(vMouseDist);
                float mask = smoothstep(uShieldRadius, 0.0, dist);
                
                if (mask < 0.01) discard;

                // Irisierende Füllung
                vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.3) + vec3(0, 0.33, 0.67)));
                
                // Da wir echtes Wireframe nutzen, mischen wir hier nur die Füllungsfarbe
                // Die weiße Outline wird durch ein zweites Mesh realisiert für saubere Trennung
                gl_FragColor = vec4(irid, mask * 0.6);
            }
        `
    });

    const geo = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    const mainMesh = new THREE.Mesh(geo, mainMat);
    scene.add(mainMesh);

    // Ghost Füllung
    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    const ghostMesh = new THREE.Mesh(ghostGeo, ghostMat);
    scene.add(ghostMesh);

    // Ghost Outline (Rein Weiß)
    const outlineMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        wireframe: true, 
        transparent: true,
        opacity: 0.0 // Startet unsichtbar, wird via Shader-Logik im Loop gesteuert
    });
    const outlineMesh = new THREE.Mesh(ghostGeo, outlineMat);
    scene.add(outlineMesh);

    window.addEventListener('mousemove', (e) => {
        targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
        targetInput.y = -(e.clientY / window.innerHeight) * 2 - 1;
    });

    function animate() {
        requestAnimationFrame(animate);
        currentInput.x += (targetInput.x - currentInput.x) * CONFIG.lerpFactor;
        currentInput.y += (targetInput.y - currentInput.y) * CONFIG.lerpFactor;

        mainMat.uniforms.uTime.value += 0.02;
        mainMat.uniforms.uMouse.value.set(currentInput.x, currentInput.y);
        
        ghostMat.uniforms.uTime.value += 0.02;
        ghostMat.uniforms.uMouse.value.set(currentInput.x, currentInput.y);

        // Rotation
        mainMesh.rotation.y += CONFIG.rotationSpeed;
        
        // Ghost rotiert analog zur Maus
        ghostMesh.rotation.x = -currentInput.y * CONFIG.ghostRotationStrength;
        ghostMesh.rotation.y = currentInput.x * CONFIG.ghostRotationStrength;
        outlineMesh.rotation.copy(ghostMesh.rotation);

        // Die Sichtbarkeit der weißen Outline an die Mausdistanz koppeln (analog zum Shield Fade)
        // Da MeshBasicMaterial keine vMouseDist hat, nutzen wir eine einfache Annäherung
        outlineMat.opacity = 0.8; 

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
