<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sticky Spike - Final Fix</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 20, 30, 0.8); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui">
    SYSTEM: ROTATION_INDEPENDENT<br>
    SPIKE_GRADIENT: ACTIVE<br>
    DOCKING: LOCAL_SPACE
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        detail: 40,
        mainSharpness: 35.0,
        maxReach: 1.6,
        rotationSpeed: 0.005
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 9;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uLocalMouse: { value: new THREE.Vector3(0, 0, 0) },
            uIntensity: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying float vSpikeHeight;
            uniform float uTime;
            uniform vec3 uLocalMouse;
            uniform float uIntensity;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                
                // 1. STICKY LOGIK IM LOCAL SPACE (Verhindert Gegenläufigkeit)
                vec3 localDirToMouse = normalize(uLocalMouse);
                float alignment = max(0.0, dot(normalize(position), localDirToMouse));
                
                // Hauptspike Kraftfeld
                float mainSpike = pow(alignment, ${CONFIG.mainSharpness.toFixed(1)});
                
                // Fraktale für Textur
                float noise = sin(position.x * 12.0 + uTime) * cos(position.y * 12.0);
                float fractal = pow(max(0.0, noise), 10.0) * 0.5;

                float totalDistortion = (mainSpike + fractal) * uIntensity * ${CONFIG.maxReach.toFixed(1)};
                vSpikeHeight = totalDistortion; // Für den Farbverlauf im Fragment Shader

                vec3 newPos = position + normalize(position) * totalDistortion;
                
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vViewDir = normalize(cameraPosition - worldPos.xyz);
                
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying float vSpikeHeight;
            uniform float uTime;

            void main() {
                // Low-Poly Shading
                float faceAngle = dot(vNormal, vViewDir);
                
                // FARBVERLAUF LOGIK:
                // Mix aus Spike-Höhe (Basis zu Spitze) und Kamera-Winkel (Iridiszenz)
                vec3 baseColor = vec3(step(0.1, sin(gl_FragCoord.y * 0.1 + uTime)));
                
                // Verlauf von Cyan (Basis) zu Magenta/Weiß (Spitze)
                vec3 spikeColor = mix(vec3(0.0, 0.8, 1.0), vec3(1.0, 0.0, 0.5), vSpikeHeight * 0.5);
                
                // 25 Grad Iridiszenz-Check
                vec3 finalColor;
                if(faceAngle > 0.906) {
                    finalColor = mix(spikeColor, vec3(1.0), vSpikeHeight);
                } else {
                    finalColor = baseColor;
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    // --- MOUSE TO LOCAL SPACE LOGIK ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const worldIntersect = new THREE.Vector3();

    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        raycaster.ray.intersectPlane(plane, worldIntersect);

        // WICHTIG: Welt-Koordinate in lokale Koordinate des rotierenden Meshs umwandeln
        const localPoint = mesh.worldToLocal(worldIntersect.clone());
        material.uniforms.uLocalMouse.value.copy(localPoint);
        material.uniforms.uIntensity.value = 1.0;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
