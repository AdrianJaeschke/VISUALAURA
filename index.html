<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Needle Spike</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; cursor: crosshair !important; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: monospace; pointer-events: none;
            background: rgba(0, 10, 20, 0.9); padding: 10px; border: 1px solid #00f0ff;
            font-size: 11px; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="ui">Mode: Linear_Vector_Spike // Sharpness: Ultra</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // TUNING PARAMETERS
    // ==========================================
    const CONFIG = {
        radius: 2.5,
        detail: 200,             // Maximale Auflösung für die dünne Linie
        activationRange: 0.95,
        lineSharpness: 50.0,    // Höher = dünnere "Linien"-Optik
        maxReach: 12.0,         // Wie weit die Nadel schießen kann
        rotationSpeed: 0.001
    };

    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewPosition;
        uniform float uTime;
        uniform float uIntensity;
        uniform vec2 uMouse;

        // Noise für die radialen Neben-Spikes
        float hash(float n) { return fract(sin(n) * 43758.5453123); }
        float noise(vec3 x) {
            vec3 p = floor(x); vec3 f = fract(x);
            f = f*f*(3.0-2.0*f);
            float n = p.x + p.y*57.0 + 113.0*p.z;
            return mix(mix(mix(hash(n+0.0), hash(n+1.0), f.x), mix(hash(n+57.0), hash(n+58.0), f.x), f.y),
                       mix(mix(hash(n+113.0), hash(n+114.0), f.x), mix(hash(n+170.0), hash(n+171.0), f.x), f.y), f.z);
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            
            // Zielpunkt der Nadel (Maus-Position)
            vec3 targetPos = vec3(uMouse * 10.0, 5.0);
            vec3 dirToTarget = normalize(targetPos - worldPos.xyz);
            
            // LINEAR LOGIC:
            // Wir berechnen die Ausrichtung des Punktes zum Ziel.
            // Je exakter der Punkt zum Ziel schaut, desto länger der Spike.
            float alignment = max(0.0, dot(normalize(position), normalize(targetPos)));
            
            // EXTREME SCHÄRFE:
            // Durch eine sehr hohe Potenz wird aus der "Glocke" eine "Linie"
            float linearFactor = pow(alignment, CONFIG_SHARPNESS);
            
            // Neben-Spikes: Rauschen nur dort, wo der Linearfaktor aktiv ist
            float n = noise(position * 8.0 + uTime);
            float radialBreak = linearFactor * (0.3 + 0.7 * n);
            
            // Die Verschiebung folgt der Richtung zum Cursor
            vec3 pull = (targetPos - worldPos.xyz) * uIntensity;
            vec3 newPos = position + pull * radialBreak;
            
            vWorldPosition = (modelMatrix * vec4(newPos, 1.0)).xyz;
            vViewPosition = (modelViewMatrix * vec4(newPos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewPosition;
        uniform float uTime;

        void main() {
            vec3 fNormal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));
            vec3 viewDir = normalize(-vViewPosition);
            float fresnel = pow(1.0 - dot(fNormal, viewDir), 3.0);
            
            vec3 color;
            float stripes = step(0.1, sin(vWorldPosition.y * 20.0 + uTime * 5.0));
            
            // Die Nadelspitzen glühen in Cyan
            color = mix(vec3(stripes), vec3(0.0, 1.0, 1.0), fresnel);
            
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    // --- Engine ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader.replace('CONFIG_SHARPNESS', CONFIG.lineSharpness.toFixed(1)),
        fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) }
        },
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    camera.position.z = 11;

    let targetInt = 0;
    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        material.uniforms.uMouse.value.set(x, y);
        
        const d = Math.sqrt(x*x + y*y);
        targetInt = d < CONFIG.activationRange ? (CONFIG.activationRange - d) * 4.0 : 0;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        material.uniforms.uIntensity.value += (targetInt - material.uniforms.uIntensity.value) * 0.15;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
