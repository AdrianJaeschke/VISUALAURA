<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Stachel-Aura</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; cursor: crosshair; }
        canvas { display: block; }
        #status {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #00f0ff; font-family: monospace; z-index: 10; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 30px;
            border: 1px solid #00f0ff; text-transform: uppercase; font-size: 11px;
        }
    </style>
</head>
<body>
<div id="status">Annähern, um Stacheln zu aktivieren</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;
        uniform float uIntensity;

        // Simplex Noise
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            vec4 j = p - 49.0 * floor(p * 0.02040816326);
            vec4 x_ = floor(j * 0.14285714285); vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * 0.14285714285 + 0.07142857142; vec4 y = y_ * 0.14285714285 + 0.07142857142;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
            vec4 m = max(0.6 - vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)), 0.0);
            return 42.0 * dot(m*m*m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            float noise = snoise(position * 0.7 + uTime * 0.3);
            
            // Extreme Nadel-Mathematik
            // uIntensity steuert jetzt den Faktor, wie weit die Spitzen rausgehen
            float spike = pow(max(0.0, noise + 0.6), 4.0); 
            vec3 newPos = position + normal * spike * uIntensity;
            
            vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
            vWorldPosition = worldPos.xyz;
            vViewPosition = (modelViewMatrix * vec4(newPos, 1.0)).xyz;
            
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;

        void main() {
            vec3 fNormal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));
            vec3 viewDir = normalize(-vViewPosition);
            float angle = dot(fNormal, viewDir);
            float threshold = 0.906; // 25 Grad

            vec3 finalColor;
            if (angle > threshold) {
                // Iridiszent
                float colorFlow = sin(angle * 20.0 + uTime * 4.0) * 0.5 + 0.5;
                finalColor = mix(vec3(0.0, 1.0, 1.0), vec3(1.0, 0.0, 1.0), colorFlow);
            } else {
                // Zebra Muster
                float stripes = sin(vWorldPosition.y * 12.0 + vWorldPosition.x * 8.0 + uTime * 5.0);
                finalColor = vec3(step(0.1, stripes));
            }
            gl_FragColor = vec4(finalColor, 1.0);
        }
    `;

    // --- SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(2, 15); 
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0.0 } // Startet flach
        },
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    camera.position.z = 8;

    let targetIntensity = 0.0;

    // --- DESKTOP PROXIMITY LOGIC ---
    window.addEventListener('mousemove', (e) => {
        // Berechne Abstand der Maus zur Bildschirmmitte
        const mouseX = (e.clientX / window.innerWidth) - 0.5;
        const mouseY = (e.clientY / window.innerHeight) - 0.5;
        const dist = Math.sqrt(mouseX * mouseX + mouseY * mouseY);

        // Je kleiner dist (näher am Zentrum), desto höher die Intensity
        // Wir invertieren den Abstand: 0.5 ist weit weg, 0.0 ist genau drauf
        targetIntensity = Math.max(0, (0.5 - dist) * 15.0); 
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.015;
        
        // Sanfter Übergang beim Ausfahren
        material.uniforms.uIntensity.value += (targetIntensity - material.uniforms.uIntensity.value) * 0.1;
        
        mesh.rotation.y += 0.005;
        mesh.rotation.z += 0.002;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
