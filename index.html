<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Zebra Shield - Gyro UI</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        
        #ui-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        button {
            padding: 15px 25px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        button:hover { background: rgba(0, 240, 255, 0.3); }

        #status-text {
            color: #00f0ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00f0ff;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div id="status-text">SYSTEM STANDBY</div>
    <div class="btn-container">
        <button id="btn-touch">Touch Mode</button>
        <button id="btn-gyro">Gyro Mode</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 2.9,
        detail: 2, // 2 = Low Poly Look
        stripeDensity: 11.0,
        shieldSize: 0.52,
        shieldSharpness: 0.15,
        lerpFactor: 0.12
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    // --- SHADER ---
    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            // Flat Shading Trick für Shader
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 pPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    // ZEBRA INNER
    const zebraMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            void main() {
                float stripes = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 3.0));
                // Flat Shading Look durch Normalen
                float light = dot(vNormal, vec3(0.5, 1.0, 0.5)) * 0.5 + 0.5;
                vec3 col = mix(vec3(0.05), vec3(1.0), stripes) * light;
                gl_FragColor = vec4(col, 1.0);
            }
        `
    });

    // MAGIC SHIELD
    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uAspect: { value: window.innerWidth / window.innerHeight }
        },
        transparent: true,
        depthTest: false,
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uAspect;

            float magic(vec3 p) {
                p *= 1.2;
                return sin(p.x + sin(p.y + uTime)) * cos(p.z + uTime);
            }

            void main() {
                vec2 diff = vScreenPos - uMouse;
                diff.x *= uAspect;
                float dist = length(diff);
                float mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.stripeDensity}, dist);
                mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, dist);
                
                if (mask < 0.01) discard;

                float noise = magic(vLocalPos + uTime * 0.3);
                vec3 rainbow = 0.5 + 0.5 * cos(6.28 * (vec3(1,1,1) * (noise + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                
                // Flat Shading Kanten hervorheben
                float edge = pow(1.0 - abs(vNormal.z), 2.0);
                gl_FragColor = vec4(rainbow + edge * 0.3, mask);
            }
        `
    });

    // MESHES
    const geo = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    geo.computeFlatVertexNormals(); // WICHTIG FÜR FLAT LOOK
    const inner = new THREE.Mesh(geo, zebraMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    ghostGeo.computeFlatVertexNormals();
    const ghost = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(ghost);

    const wire = new THREE.Mesh(ghostGeo, new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.15 }));
    scene.add(wire);

    // INPUT
    const update = (x, y) => {
        targetInput.x = (x / window.innerWidth) * 2 - 1;
        targetInput.y = -(y / window.innerHeight) * 2 + 1;
    };

    const startSystem = (mode) => {
        document.getElementById('ui-overlay').style.display = 'none';
        if(mode === 'touch') {
            window.addEventListener('mousemove', (e) => update(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => update(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        }
    };

    document.getElementById('btn-touch').onclick = () => startSystem('touch');

    document.getElementById('btn-gyro').onclick = async () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res === 'granted') {
                window.addEventListener('deviceorientation', (e) => {
                    targetInput.x = (e.gamma / 45);
                    targetInput.y = (e.beta - 45) / 45;
                });
            }
        } else {
            window.addEventListener('deviceorientation', (e) => {
                targetInput.x = (e.gamma / 45);
                targetInput.y = (e.beta - 45) / 45;
            });
        }
        startSystem('gyro');
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        const time = performance.now() * 0.001;
        zebraMat.uniforms.uTime.value = time;
        shieldMat.uniforms.uTime.value = time;
        shieldMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += 0.005;
        ghost.rotation.set(-currentInput.y * 0.5, currentInput.x * 0.5, 0);
        wire.rotation.copy(ghost.rotation);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = camera.aspect;
    };
</script>
</body>
</html>
