<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Magnetic Aura</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; cursor: crosshair !important; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: monospace; pointer-events: none;
            background: rgba(0, 40, 60, 0.5); padding: 15px; border-radius: 8px; border: 1px solid #00f0ff;
        }
    </style>
</head>
<body>
<div id="ui">MODE: DOCKING SPIKES | RADIAL DECAY: ACTIVE</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // ANPASSBARE PARAMETER
    // ==========================================
    const CONFIG = {
        sphereRadius: 2.5,
        detail: 40,             // Erhöht für glattere Übergänge der vielen Spikes
        activationRadius: 0.85, // Weite der Interaktionszone
        influenceRange: 3.5,    // Wie breit die radialen Neben-Spikes streuen
        rotationSpeed: 0.003
    };

    const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;
        uniform float uIntensity;
        uniform vec2 uMouse;

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            
            // Maus-Position im Raum (z=4 für Greif-Effekt)
            vec3 mousePos3D = vec3(uMouse * 10.0, 4.0);
            
            // Distanz von diesem Vertex zur Maus-Projektion
            float distToMouse = distance(worldPos.xyz, mousePos3D);
            
            // RADIALER ABFALL: 
            // Eine scharfe Gauß-Kurve für den Haupt-Spike und die radialen Neben-Spikes
            float falloff = exp(-pow(distToMouse / CONFIG.influenceRange, 2.0));
            
            // DOCKING LOGIC:
            // Wir berechnen den Vektor von der Kugeloberfläche zur Maus
            vec3 pullDir = mousePos3D - worldPos.xyz;
            
            // Nur Vertices auf der Vorderseite werden gezogen
            float sideMask = max(0.0, dot(normalize(position), normalize(mousePos3D)));
            
            // Finale Verschiebung:
            // Wir ziehen den Vertex in Richtung Maus, skaliert durch Intensität und Falloff
            vec3 offset = pullDir * falloff * uIntensity * sideMask;
            
            // Smooth Transition zurück zur Kugel (Basis-Schutz)
            float stretchLimit = smoothstep(0.0, 0.2, falloff);
            vec3 newPos = position + (offset * stretchLimit);
            
            vWorldPosition = (modelMatrix * vec4(newPos, 1.0)).xyz;
            vViewPosition = (modelViewMatrix * vec4(newPos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;
        uniform float uTime;

        void main() {
            vec3 fNormal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));
            vec3 viewDir = normalize(-vViewPosition);
            float angle = dot(fNormal, viewDir);
            
            vec3 finalColor;
            if (angle > 0.906) {
                float flow = sin(angle * 20.0 + uTime * 4.0) * 0.5 + 0.5;
                finalColor = mix(vec3(0.0, 1.0, 1.0), vec3(1.0, 1.0, 1.0), flow);
            } else {
                // Zebra mit Zeit-Animation
                float stripes = sin(vWorldPosition.y * 8.0 + vWorldPosition.x * 4.0 + uTime * 3.0);
                finalColor = vec3(step(0.1, stripes));
            }
            gl_FragColor = vec4(finalColor, 1.0);
        }
    `;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(CONFIG.sphereRadius, CONFIG.detail);
    const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader.replace('CONFIG.influenceRange', CONFIG.influenceRange.toFixed(1)),
        fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) }
        },
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    camera.position.z = 12;

    let targetIntensity = 0;

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        material.uniforms.uMouse.value.set(x, y);

        const dist = Math.sqrt(x*x + y*y);
        if (dist < CONFIG.activationRadius) {
            targetIntensity = (CONFIG.activationRadius - dist) * 3.0;
        } else {
            targetIntensity = 0;
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.01;
        material.uniforms.uIntensity.value += (targetIntensity - material.uniforms.uIntensity.value) * 0.08;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
