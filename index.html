<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamische Noise-Skulptur</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; touch-action: none; }
        canvas { display: block; }
        #status-box {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px; padding: 12px 20px; color: #00f0ff; font-family: monospace;
            font-size: 13px; text-align: center; transition: opacity 0.5s ease; z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="status-box">Initialisiere generative Skulptur...</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // SHADER DEFINITIONEN (GLSL)
    // Wir nutzen Simplex Noise für organische Dynamik
    // ==========================================
    
    // Vertex Shader: Verformt die Geometrie
    const vertexShader = `
        uniform float uTime;
        uniform float uIntensity; // Gesteuert durch Maus/Gyro
        varying vec3 vNormal;
        varying float vNoise;

        // Simplex 3D Noise Funktion (GLSL Implementierung)
        vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
        float snoise(vec3 v){ 
            const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4  C4 = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - C.yyy;
            i = mod(i, 289.0); 
            vec4 p = permute( permute( permute( 
                    i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 1.0/7.0; 
            vec3  ns = n_ * D4.xyz - D4.www;
            vec4 j = p - 49.0 * floor(p * ns.z *ns.z); 
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = inversesqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            
            // Berechne 3D Noise basierend auf Position und Zeit
            // Wir nutzen uIntensity, um die Stärke der Verformung zu steuern.
            vNoise = snoise(position * 0.5 + uTime * 0.2); 
            
            // Verforme die Position entlang der Normale (atmen)
            float distortion = vNoise * uIntensity * 1.5;
            vec3 newPosition = position + normal * distortion;
            
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }
    `;

    // Fragment Shader: Berechnet die strahlende, iridisierende Farbe
    const fragmentShader = `
        varying vec3 vNormal;
        varying float vNoise;
        uniform float uTime;

        void main() {
            // Berechne harte Kanten für Low-Poly Look
            vec3 fNormal = normalize(cross(dFdx(vNormal), dFdy(vNormal)));
            float diffuse = dot(fNormal, normalize(vec3(0.0, 0.0, 1.0))) * 0.5 + 0.5;

            // Iridisierende Farben basierend auf Noise-Verformung und Zeit
            // Dies lässt die Farben auf der Oberfläche fließen
            vec3 color1 = vec3(0.0, 1.0, 1.0); // Cyan
            vec3 color2 = vec3(1.0, 0.0, 1.0); // Magenta
            vec3 color3 = vec3(1.0, 1.0, 0.0); // Yellow
            
            // Mische Farben basierend auf Noise-Wert
            float hue = vNoise * 0.5 + 0.5; // Normalisiere auf [0, 1]
            vec3 finalColor = mix(mix(color1, color2, hue), color3, sin(uTime * 0.5 + hue * 3.0) * 0.5 + 0.5);

            // Selbststrahlung (Emissive) mit leichtem Kanten-Look
            gl_FragColor = vec4(finalColor * (0.9 + diffuse * 0.1), 1.0);
        }
    `;

    // --- Variables & Setup ---
    let scene, camera, renderer, mesh, material;
    let targetIntensity = 0.5; // Grund-Verformung
    const statusBox = document.getElementById('status-box');

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // GEOMETRIE: Eine detaillierte Kugel für weiche Noise-Verformung
        const geometry = new THREE.IcosahedronGeometry(3, 20); // Radius 3, 20 Detailschritte
        
        // MATERIAL: ShaderMaterial für Dynamik und Selbststrahlung
        material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uIntensity: { value: 0.5 }
            },
            wireframe: false,
            flatShading: true, // Wichtig für Low-Poly Kanten
            side: THREE.DoubleSide
        });

        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Keine Lichter nötig!
        animate();
    }

    // --- Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);

        // Update Shader Uniforms
        material.uniforms.uTime.value += 0.01;
        
        // Sanfte Annäherung der Intensität (gesteuert durch Input)
        material.uniforms.uIntensity.value += (targetIntensity - material.uniforms.uIntensity.value) * 0.05;

        // Langsame Grund-Rotation
        mesh.rotation.y += 0.002;
        mesh.rotation.x += 0.001;

        renderer.render(scene, camera);
    }

    // --- Input & Status Logik ---
    function updateStatus(msg, isError = false) { statusBox.innerHTML = msg; statusBox.style.opacity = '1'; setTimeout(() => statusBox.style.opacity = '0.3', 3000); }

    const activateGyro = () => {
        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null) {
                // Gyro steuert die *Stärke* der Verformung, nicht die Rotation
                // Beta/Gamma normalisieren und als Intensität nutzen
                targetIntensity = Math.abs(e.beta / 180) + Math.abs(e.gamma / 90);
                targetIntensity = Math.min(targetIntensity * 0.8, 1.5); // Deckeln
            }
        }, true);
        updateStatus("Noise-Skulptur aktiv ✓");
    };

    // Sensor Freischaltung
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        updateStatus("Tippen für interaktive Dynamik...");
        window.addEventListener('click', function handler() {
            DeviceOrientationEvent.requestPermission().then(s => s==='granted'?activateGyro():updateStatus("Verweigert", true));
            window.removeEventListener('click', handler);
        }, { once: true });
    } else if (window.DeviceOrientationEvent) { activateGyro(); }
    else { 
        updateStatus("Kein Gyro - Maus steuert Dynamik"); 
        window.addEventListener('mousemove', (e) => {
            // Mausposition Y steuert Intensität
            targetIntensity = (1.0 - (e.clientY / window.innerHeight)) * 1.5;
        });
    }

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    init();
</script>
</body>
</html>
