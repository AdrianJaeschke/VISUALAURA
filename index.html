<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Aura Sculpture</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 240, 255, 0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 10px;
            padding: 15px; color: #00f0ff; font-family: monospace;
            text-align: center; z-index: 10; pointer-events: auto; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="ui" onclick="requestAccess()">STATUS: SYSTEM INITIALISIEREN... <br> [KLICKEN FÜR SENSOR-ZUGRIFF]</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, mesh, material;
    let targetX = 0, targetY = 0;

    // Shader für die Mandelbrot-Aura
    const vertexShader = `
        varying vec2 vUv;
        varying float vHeight;
        uniform float uTime;
        uniform vec2 uMouse;

        void main() {
            vUv = uv;
            // Mandelbrot Logik auf die Position anwenden
            vec2 c = (uv - 0.5) * 4.0;
            c += uMouse * 0.5; // Verschiebung durch Input
            
            vec2 z = vec2(0.0);
            float iter = 0.0;
            for(float i = 0.0; i < 20.0; i++) {
                z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
                if(length(z) > 2.0) break;
                iter++;
            }
            
            vHeight = iter / 20.0;
            vec3 newPos = position;
            // Erzeugt die Zacken basierend auf der Iteration
            newPos.z += vHeight * 4.0 * sin(uTime * 0.5); 
            
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `
        varying vec2 vUv;
        varying float vHeight;
        uniform float uTime;

        void main() {
            // Iridisierende Farben basierend auf Höhe und Zeit
            vec3 color = 0.5 + 0.5 * cos(uTime + vec3(vHeight * 5.0, vHeight * 5.0 + 2.0, vHeight * 5.0 + 4.0));
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Geometrie für Low-Poly Aura (Zacken und Dreiecke)
        const geometry = new THREE.PlaneGeometry(15, 15, 150, 150);
        
        material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0, 0) }
            },
            wireframe: false,
            flatShading: true,
            side: THREE.DoubleSide
        });

        mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = -Math.PI / 4;
        scene.add(mesh);

        animate();
    }

    // Input Handling
    window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2.0;
        targetY = (e.clientY / window.innerHeight - 0.5) * -2.0;
    });

    window.requestAccess = function() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') {
                    window.addEventListener('deviceorientation', handleGyro);
                    document.getElementById('ui').innerText = "STATUS: GYRO AKTIV";
                }
            });
        } else {
            window.addEventListener('deviceorientation', handleGyro);
            document.getElementById('ui').innerText = "STATUS: SENSOREN BEREIT";
        }
    };

    function handleGyro(e) {
        targetX = e.gamma / 45.0;
        targetY = (e.beta - 45) / 45.0;
    }

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        
        // Glatte Annäherung der Werte (Mandelbrot Parameter verändern)
        material.uniforms.uMouse.value.x += (targetX - material.uniforms.uMouse.value.x) * 0.1;
        material.uniforms.uMouse.value.y += (targetY - material.uniforms.uMouse.value.y) * 0.1;
        
        mesh.rotation.z += 0.002;
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
