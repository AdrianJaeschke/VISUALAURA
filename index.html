<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shield Sphere Pro - Fixed Visibility</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 30px; left: 30px; color: #00f0ff; 
            font-family: "Boldonse", sans-serif; font-size: 12px;
            pointer-events: none; z-index: 100; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        #start-btn {
            padding: 20px 40px; background: none; border: 2px solid #00f0ff;
            color: #00f0ff; font-family: "Boldonse", sans-serif; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px;
        }
    </style>
</head>
<body>

<div id="ui">SYSTEM: ONLINE<br>SENSOR: <span id="status">STABLE</span></div>

<div id="overlay">
    <button id="start-btn">ACTIVATE SYSTEM</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 3.0,
        detail: 2,
        stripeDensity: 12.0,
        viewAngle: 28,
        rotationSpeed: 0.005,
        lerpFactor: 0.1,
        ghostRotationStrength: 1.5,
        // SCHILD PARAMETER (Voll deckend)
        shieldSize: 0.6,          
        shieldSharpness: 0.02,    
        shieldOpacity: 1.0        
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vec4 pPos = projectionMatrix * mvPos;
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    const innerMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uThreshold: { value: Math.cos(CONFIG.viewAngle * Math.PI / 180) }
        },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            uniform float uThreshold;
            void main() {
                float zebra = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0));
                vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                float switcher = step(uThreshold, vNormal.z);
                gl_FragColor = vec4(mix(vec3(zebra), rainbow, switcher), 1.0);
            }
        `
    });

    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uAspect: { value: window.innerWidth / window.innerHeight },
            uIsOutline: { value: false }
        },
        transparent: true, // Erforderlich für die Maskierung
        depthWrite: false, // Verhindert Z-Fighting
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            uniform vec2 uMouse;
            uniform float uAspect;
            uniform float uTime;
            uniform bool uIsOutline;

            void main() {
                vec2 diff = vScreenPos - uMouse;
                diff.x *= uAspect; 
                float dist = length(diff);
                
                // Maske ohne Discard für bessere Stabilität
                float mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, dist);
                
                vec3 color;
                if (uIsOutline) {
                    color = vec3(1.0);
                } else {
                    color = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.4) + vec3(0, 0.33, 0.67)));
                }

                // Hier nutzen wir mask direkt als Alpha für deckende Flächen
                gl_FragColor = vec4(color, mask * ${CONFIG.shieldOpacity});
            }
        `
    });

    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), innerMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    const shieldFill = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(shieldFill);

    const shieldOutlineMat = shieldMat.clone();
    shieldOutlineMat.uniforms.uIsOutline.value = true;
    shieldOutlineMat.wireframe = true;
    const shieldOutline = new THREE.Mesh(ghostGeo, shieldOutlineMat);
    scene.add(shieldOutline);

    const startBtn = document.getElementById('start-btn');
    startBtn.onclick = async () => {
        document.getElementById('overlay').style.display = 'none';
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission === 'granted') window.addEventListener('deviceorientation', (e) => {
                targetInput.x = (e.gamma / 45);
                targetInput.y = (e.beta - 45) / 45;
            });
        } else {
            window.addEventListener('mousemove', (e) => {
                targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetInput.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        innerMat.uniforms.uTime.value += 0.015;
        shieldMat.uniforms.uTime.value += 0.015;
        shieldOutlineMat.uniforms.uTime.value += 0.015;

        shieldMat.uniforms.uMouse.value.copy(currentInput);
        shieldOutlineMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += CONFIG.rotationSpeed;
        
        const rotX = -currentInput.y * CONFIG.ghostRotationStrength;
        const rotY = currentInput.x * CONFIG.ghostRotationStrength;
        shieldFill.rotation.set(rotX, rotY, 0);
        shieldOutline.rotation.set(rotX, rotY, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = aspect;
        shieldOutlineMat.uniforms.uAspect.value = aspect;
    };
</script>
</body>
</html>
