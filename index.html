<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shield Sphere v2 - Fixed Mapping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 30px; left: 30px; color: #00f0ff; 
            font-family: "Boldonse", sans-serif; font-size: 12px;
            pointer-events: none; z-index: 100; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        #start-btn {
            padding: 20px 40px; background: none; border: 2px solid #00f0ff;
            color: #00f0ff; font-family: "Boldonse", sans-serif; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px;
        }
    </style>
</head>
<body>

<div id="ui">SYSTEM: ONLINE<br>SENSOR: <span id="status">READY</span></div>

<div id="overlay">
    <button id="start-btn">INITIALIZE SHIELD</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 3.0,
        detail: 2,
        stripeDensity: 12.0,
        viewAngle: 28,
        rotationSpeed: 0.005,
        lerpFactor: 0.1,
        ghostRotationStrength: 1.5,
        shieldSize: 0.7 
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    // --- SHADER LOGIK ---
    
    // Vertex Shader: Nutzt lokale Positionen für korrektes Texture-Wrapping
    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vMouseDist;
        uniform vec2 uMouse;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position; // Lokale Koordinaten für das Zebra
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vec4 pPos = projectionMatrix * mvPos;
            vMouseDist = (pPos.xy / pPos.w) - uMouse;
            gl_Position = pPos;
        }
    `;

    // Inner Sphere Material
    const innerMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uThreshold: { value: Math.cos(CONFIG.viewAngle * Math.PI / 180) }
        },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            uniform float uThreshold;
            void main() {
                // Zebra Mapping auf lokaler Y-Achse (dreht sich mit)
                float zebra = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0));
                vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                float switcher = step(uThreshold, vNormal.z);
                gl_FragColor = vec4(mix(vec3(zebra), rainbow, switcher), 1.0);
            }
        `
    });

    // Ghost Shield Material (0.9 Transparenz für Outlines)
    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIsOutline: { value: false },
            uShieldSize: { value: CONFIG.shieldSize }
        },
        transparent: true,
        depthWrite: false,
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vMouseDist;
            varying vec3 vNormal;
            uniform float uTime;
            uniform bool uIsOutline;
            uniform float uShieldSize;
            void main() {
                float dist = length(vMouseDist);
                float mask = smoothstep(uShieldSize, uShieldSize - 0.1, dist);
                
                if (uIsOutline) {
                    // Harte 0.9 Transparenz für die weiße Outline im Shield-Bereich
                    gl_FragColor = vec4(1.0, 1.0, 1.0, mask * 0.9);
                } else {
                    // Irisierende Füllung
                    vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.4) + vec3(0, 0.33, 0.67)));
                    gl_FragColor = vec4(irid, mask * 0.3);
                }
            }
        `
    });

    // Meshes
    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), innerMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    const shieldFill = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(shieldFill);

    const shieldOutlineMat = shieldMat.clone();
    shieldOutlineMat.uniforms.uIsOutline.value = true;
    shieldOutlineMat.wireframe = true;
    const shieldOutline = new THREE.Mesh(ghostGeo, shieldOutlineMat);
    scene.add(shieldOutline);

    // --- INTERACTION LOGIC ---
    const startBtn = document.getElementById('start-btn');
    const statusTxt = document.getElementById('status');

    startBtn.onclick = async () => {
        document.getElementById('overlay').style.display = 'none';
        
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', (e) => {
                        targetInput.x = (e.gamma / 45);
                        targetInput.y = (e.beta - 45) / 45;
                    });
                    statusTxt.innerText = 'GYRO ACTIVE';
                }
            } catch (e) { statusTxt.innerText = 'ERROR'; }
        } else {
            window.addEventListener('mousemove', (e) => {
                targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetInput.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            statusTxt.innerText = 'MOUSE ACTIVE';
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        innerMat.uniforms.uTime.value += 0.015;
        innerMat.uniforms.uMouse.value.copy(currentInput);
        
        shieldMat.uniforms.uTime.value += 0.015;
        shieldMat.uniforms.uMouse.value.copy(currentInput);
        shieldOutlineMat.uniforms.uTime.value += 0.015;
        shieldOutlineMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += CONFIG.rotationSpeed;
        
        // Ghost rotiert mit Maus-Offset
        const rotX = -currentInput.y * CONFIG.ghostRotationStrength;
        const rotY = currentInput.x * CONFIG.ghostRotationStrength;
        shieldFill.rotation.set(rotX, rotY, 0);
        shieldOutline.rotation.set(rotX, rotY, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
