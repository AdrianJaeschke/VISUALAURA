<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Low Poly Sphere Config</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair !important; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: 'Courier New', monospace; font-size: 10px;
            background: rgba(0, 15, 25, 0.9); padding: 12px; border: 1px solid #00f0ff;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui">
    GEOMETRY: LOW_POLY_ICOSA<br>
    SHADING: FLAT_FACETED<br>
    STATUS: CONFIG_READY
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // ==========================================
    // ERWEITERTE PARAMETER LISTE
    // ==========================================
    const CONFIG = {
        // Geometrie & Low Poly
        radius: 2.5,
        detail: 2,              // LOW POLY PARAMETER: 1-3 für harten Look, >20 für glatt
        flatShading: true,      // Erzwingt harte Kanten
        
        // Spikes
        spikeSharpness: 22.0,
        maxReach: 1.8,
        
        // Zebra & Optik
        stripeDensity: 15.0,
        viewAngle: 25,          // Grad-Logik für Iridiszenz
        rotationSpeed: 0.005,
        iridSpeed: 0.3
    };

    const angleThreshold = Math.cos(CONFIG.viewAngle * (Math.PI / 180));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Icosahedron ist ideal für Low Poly, da es gleichmäßige Dreiecke erzeugt
    const geometry = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 0 },
            uRotationY: { value: 0 },
            uThreshold: { value: angleThreshold }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;
            uniform float uRotationY;

            mat3 rotateY(float a) {
                return mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
            }

            void main() {
                vec3 compPos = rotateY(uRotationY) * position;
                
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.6, 0.0, d);
                
                float noise = sin(position.x * 12.0) * cos(position.y * 12.0 + uTime);
                vSpike = pow(max(0.0, influence + noise * 0.25), ${CONFIG.spikeSharpness.toFixed(1)});

                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                vViewDir = normalize(cameraPosition - vWorldPos);
                
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform float uThreshold;

            vec3 spectral(float t) {
                return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
            }

            void main() {
                // FLAT SHADING LOGIK: Berechnet Normalen pro Dreieck für Low Poly Look
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                float cameraFacing = dot(fNormal, vViewDir);
                
                float stripePattern = sin(vWorldPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0);
                float zebra = step(0.0, stripePattern);
                
                vec3 color = vec3(zebra);

                // 25 Grad Logik
                if (cameraFacing > uThreshold) {
                    float shift = (cameraFacing - uThreshold) / (1.0 - uThreshold);
                    vec3 irid = spectral(shift + uTime * ${CONFIG.iridSpeed.toFixed(1)} + vSpike);
                    color = mix(color, irid, shift);
                }

                if (vSpike > 0.1) {
                    float sideHighlight = dot(fNormal, vec3(0.3, 1.0, 0.3));
                    if(sideHighlight > 0.5) {
                        color = mix(color, spectral(vSpike + uTime), vSpike);
                    }
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    window.addEventListener('mousemove', (e) => {
        material.uniforms.uMouse.value.set(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
        );
        material.uniforms.uIntensity.value = 1.0;
    });

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        material.uniforms.uRotationY.value = mesh.rotation.y;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
