<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Shield Sphere - Final Stable</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; color: #00f0ff; 
            font-family: sans-serif; font-size: 11px; z-index: 10;
            text-transform: uppercase; letter-spacing: 1px; pointer-events: none;
        }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        button {
            padding: 15px 30px; background: none; border: 1px solid #00f0ff;
            color: #00f0ff; cursor: pointer; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="ui">SYSTEM: ACTIVE<br>SHIELD: <span id="status">WAITING</span></div>
<div id="overlay"><button id="start">INITIALIZE</button></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- PARAMETER LISTE ---
    const CONFIG = {
        radius: 2.5,
        ghostRadius: 3.1,         // Schutzschild etwas größer
        detail: 2,                // Wie fein das Gitter ist (IMG_6940.jpg Style)
        stripeDensity: 12.0,      // Wie viele Zebrastreifen
        shieldSize: 0.5,          // Größe der runden Maske
        shieldSharpness: 0.1,     // Weichheit der Kante (0.01 = hart)
        shieldOpacity: 1.0,       // Deckkraft (keine Transparenz gewünscht)
        rotationSpeed: 0.005,
        lerpFactor: 0.1
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vec4 pPos = projectionMatrix * mvPos;
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    // INNERE KUGEL (ZEBRA)
    const innerMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            void main() {
                float zebra = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0));
                vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                float fresnel = pow(1.0 - dot(vNormal, vec3(0,0,1)), 3.0);
                gl_FragColor = vec4(mix(vec3(zebra), rainbow, fresnel), 1.0);
            }
        `
    });

    // SCHILD (MASKE & OUTLINE)
    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uAspect: { value: window.innerWidth / window.innerHeight },
            uIsOutline: { value: false }
        },
        transparent: true,
        depthWrite: false, 
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            uniform vec2 uMouse;
            uniform float uAspect;
            uniform float uTime;
            uniform bool uIsOutline;

            void main() {
                vec2 diff = vScreenPos - uMouse;
                diff.x *= uAspect; // RUNDE MASKE FIX
                float dist = length(diff);
                
                float mask = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, dist);
                if (mask < 0.01) discard;

                vec3 color;
                if (uIsOutline) {
                    color = vec3(1.0); // Reinweißes Gitter
                } else {
                    color = 0.5 + 0.5 * cos(6.28318 * (vec3(1,1,1) * (vNormal.z * 0.5 + uTime * 0.4) + vec3(0, 0.33, 0.67)));
                }
                gl_FragColor = vec4(color, mask * ${CONFIG.shieldOpacity});
            }
        `
    });

    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), innerMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    const shieldFill = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(shieldFill);

    const shieldOutlineMat = shieldMat.clone();
    shieldOutlineMat.uniforms.uIsOutline.value = true;
    shieldOutlineMat.wireframe = true;
    const shieldOutline = new THREE.Mesh(ghostGeo, shieldOutlineMat);
    scene.add(shieldOutline);

    document.getElementById('start').onclick = () => {
        document.getElementById('overlay').style.display = 'none';
        window.addEventListener('mousemove', (e) => {
            targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetInput.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        document.getElementById('status').innerText = 'READY';
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);

        innerMat.uniforms.uTime.value += 0.01;
        shieldMat.uniforms.uTime.value += 0.01;
        shieldOutlineMat.uniforms.uTime.value += 0.01;

        shieldMat.uniforms.uMouse.value.copy(currentInput);
        shieldOutlineMat.uniforms.uMouse.value.copy(currentInput);

        inner.rotation.y += CONFIG.rotationSpeed;
        shieldFill.rotation.set(-currentInput.y, currentInput.x, 0);
        shieldOutline.rotation.set(-currentInput.y, currentInput.x, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        const a = window.innerWidth / window.innerHeight;
        camera.aspect = a;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = a;
        shieldOutlineMat.uniforms.uAspect.value = a;
    };
</script>
</body>
</html>
