<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hybrid Spike Sphere - Boldonse Edition</title>
    
    <!-- Deine spezifischen Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">

    <style>
        /* Deine exakte CSS Vorgabe */
        .boldonse-regular {
            font-family: "Boldonse", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        :root {
            --accent: #00f0ff;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        
        canvas { display: block; }
        
        /* UI Design mit deiner Schriftart */
        #ui {
            position: fixed; 
            top: 20px; 
            left: 20px; 
            color: var(--accent); 
            font-size: 14px;
            background: rgba(0, 15, 25, 0.8); 
            padding: 15px; 
            border: 1px solid var(--accent);
            pointer-events: none; 
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Mobile Overlay */
        #mobile-overlay {
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.5); 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 1000; 
            transition: opacity 0.5s ease;
            backdrop-filter: blur(0px);
        }

        #start-btn {
            padding: 18px 35px; 
            background: #000; 
            border: 0px solid var(--accent);
            color: var(--accent); 
            font-size: 18px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .hint {
            color: var(--accent); 
            font-size: 11px; 
            margin-top: 15px; 
            opacity: 0.8;
        }

        /* Klasse auf alle UI Elemente anwenden */
        #ui, #start-btn, .hint {
            font-family: "Boldonse", system-ui;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div id="ui">
    System: <span id="device-mode">Detecting</span><br>
    Sensor: <span id="sensor-status">Touch Active</span>
</div>

<div id="mobile-overlay">
    <button id="start-btn" class="boldonse-regular">KLICKEN UND HANDY BEWEGEN</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // CONFIG AUS DER VORIGEN LISTE
    const CONFIG = {
        radius: 2.5,
        detail: 20,
        spikeSharpness: 25.0,
        maxReach: 0.4,
        stripeDensity: 15.0,
        viewAngle: 45,
        rotationSpeed: 0.005,
        gyroSensitivity: 2.2,
        lerpFactor: 0.1 
    };

    const angleThreshold = Math.cos(CONFIG.viewAngle * (Math.PI / 180));
    let targetInput = { x: 0, y: 0 };
    let currentInput = { x: 0, y: 0 };

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uIntensity: { value: 1.0 }, 
            uThreshold: { value: angleThreshold }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uIntensity;

            void main() {
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vec4 pPos = projectionMatrix * mvPos;
                vec2 ndc = pPos.xy / pPos.w;
                float d = distance(ndc, uMouse);
                float influence = smoothstep(0.7, 0.0, d);
                float noise = sin(position.x * 10.0) * cos(position.y * 10.0 + uTime);
                vSpike = pow(max(0.0, influence + noise * 0.3), ${CONFIG.spikeSharpness.toFixed(1)});
                vec3 newPos = position + normal * vSpike * ${CONFIG.maxReach.toFixed(1)} * uIntensity;
                vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                vViewDir = normalize(cameraPosition - vWorldPos);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            varying vec3 vWorldPos;
            varying float vSpike;
            uniform float uTime;
            uniform float uThreshold;

            vec3 spectral(float t) {
                return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t + vec3(0.0, 0.33, 0.67)));
            }

            void main() {
                vec3 fNormal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
                float cameraFacing = dot(fNormal, vViewDir);
                float stripePattern = sin(vWorldPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 2.0);
                float zebra = step(0.0, stripePattern);
                vec3 color = vec3(zebra);

                if (cameraFacing > uThreshold) {
                    float shift = (cameraFacing - uThreshold) / (1.0 - uThreshold);
                    color = mix(color, spectral(shift + uTime * 0.3 + vSpike), shift);
                }
                if (vSpike > 0.1) {
                    float shine = dot(fNormal, vec3(0, 1, 0.5));
                    if(shine > 0.4) color = mix(color, spectral(vSpike + uTime), vSpike);
                }
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail), material);
    scene.add(mesh);

    // --- DEVICE LOGIC ---
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const modeLabel = document.getElementById('device-mode');
    const sensorLabel = document.getElementById('sensor-status');
    const overlay = document.getElementById('mobile-overlay');

    if (isMobile) {
        modeLabel.innerText = "Mobile Unit";
        overlay.style.display = "flex";

        // Touch ist SOFORT aktiv (Overlay ist semi-transparent)
        const updateTouch = (e) => {
            const t = e.touches[0];
            targetInput.x = (t.clientX / window.innerWidth) * 2 - 1;
            targetInput.y = (t.clientY / window.innerHeight) * 2 - 1;
        };
        window.addEventListener('touchstart', updateTouch);
        window.addEventListener('touchmove', updateTouch, { passive: false });

        // Gyroscope Permission & Start
        document.getElementById('start-btn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') activateGyro();
            } else {
                activateGyro();
            }
        });

        function activateGyro() {
            sensorLabel.innerText = "GYRO ACTIVE";
            overlay.style.opacity = "0";
            setTimeout(() => overlay.remove(), 500);
            window.addEventListener('deviceorientation', (e) => {
                targetInput.x = (e.gamma / 40) * CONFIG.gyroSensitivity;
                targetInput.y = ((e.beta - 45) / 40) * CONFIG.gyroSensitivity;
            });
        }
    } else {
        // Desktop Modus
        modeLabel.innerText = "Desktop Station";
        sensorLabel.innerText = "Mouse Tracking";
        window.addEventListener('mousemove', (e) => {
            targetInput.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetInput.y = (e.clientY / window.innerHeight) * 2 - 1;
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        currentInput.x += (targetInput.x - currentInput.x) * CONFIG.lerpFactor;
        currentInput.y += (targetInput.y - currentInput.y) * CONFIG.lerpFactor;
        material.uniforms.uMouse.value.set(currentInput.x, -currentInput.y);
        material.uniforms.uTime.value += 0.02;
        mesh.rotation.y += CONFIG.rotationSpeed;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
