<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Zebra - Stable Gyro</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        
        #ui-overlay {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000; background: rgba(0,0,0,0.7);
            font-family: 'Courier New', monospace;
        }

        .btn-container { display: flex; gap: 15px; }

        button {
            padding: 20px 30px; background: #000; border: 2px solid #00f0ff;
            color: #00f0ff; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; pointer-events: auto; font-weight: bold;
        }

        #status-text { color: #00f0ff; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div id="status-text">SHIELD INTERFACE v3.0<br>INITIALIZATION REQUIRED</div>
    <div class="btn-container">
        <button id="btn-touch">Touch</button>
        <button id="btn-gyro">Gyroscope</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        radius: 2.5,
        ghostRadius: 2.9,
        detail: 2, 
        stripeDensity: 11.0,
        shieldSize: 0.52,
        shieldSharpness: 0.18,
        lerpFactor: 0.1
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let targetInput = new THREE.Vector2(0, 0);
    let currentInput = new THREE.Vector2(0, 0);

    // --- SHADER ---
    const sharedVert = `
        varying vec3 vNormal;
        varying vec3 vLocalPos;
        varying vec2 vScreenPos;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vLocalPos = position;
            vec4 pPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vScreenPos = pPos.xy / pPos.w;
            gl_Position = pPos;
        }
    `;

    const zebraMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            void main() {
                float s = step(0.0, sin(vLocalPos.y * ${CONFIG.stripeDensity.toFixed(1)} + uTime * 3.0));
                float l = dot(vNormal, vec3(0.5, 1.0, 0.5)) * 0.5 + 0.5;
                gl_FragColor = vec4(mix(vec3(0.0), vec3(1.0), s) * l, 1.0);
            }
        `
    });

    const shieldMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uAspect: { value: window.innerWidth / window.innerHeight }
        },
        transparent: true,
        depthTest: false,
        vertexShader: sharedVert,
        fragmentShader: `
            varying vec2 vScreenPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uAspect;
            float magic(vec3 p) {
                return sin(p.x + sin(p.y + uTime)) * cos(p.z + uTime);
            }
            void main() {
                vec2 d = vScreenPos - uMouse;
                d.x *= uAspect;
                float m = 1.0 - smoothstep(${CONFIG.shieldSize}, ${CONFIG.shieldSize} + ${CONFIG.shieldSharpness}, length(d));
                if (m < 0.01) discard;
                float n = magic(vLocalPos + uTime * 0.3);
                vec3 rb = 0.5 + 0.5 * cos(6.28 * (vec3(1,1,1) * (n + uTime * 0.2) + vec3(0, 0.33, 0.67)));
                gl_FragColor = vec4(rb + pow(1.0-abs(vNormal.z), 2.0)*0.4, m);
            }
        `
    });

    // MESHES
    const geo = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.detail);
    geo.computeFlatVertexNormals();
    const inner = new THREE.Mesh(geo, zebraMat);
    scene.add(inner);

    const ghostGeo = new THREE.IcosahedronGeometry(CONFIG.ghostRadius, CONFIG.detail);
    ghostGeo.computeFlatVertexNormals();
    const ghost = new THREE.Mesh(ghostGeo, shieldMat);
    scene.add(ghost);

    // INPUT FUNCTIONS
    const updateCoord = (x, y) => {
        targetInput.x = (x / window.innerWidth) * 2 - 1;
        targetInput.y = -(y / window.innerHeight) * 2 + 1;
    };

    const setupInteraction = () => {
        document.getElementById('ui-overlay').style.display = 'none';
        window.addEventListener('mousemove', (e) => updateCoord(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            updateCoord(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
    };

    // BUTTON CLICKS
    document.getElementById('btn-touch').onclick = setupInteraction;

    document.getElementById('btn-gyro').onclick = async () => {
        try {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', (e) => {
                        targetInput.x = (e.gamma / 45);
                        targetInput.y = (e.beta - 45) / 45;
                    });
                }
            } else {
                window.addEventListener('deviceorientation', (e) => {
                    targetInput.x = (e.gamma / 45);
                    targetInput.y = (e.beta - 45) / 45;
                });
            }
        } catch (e) {
            console.error("Gyro not supported");
        }
        setupInteraction();
    };

    function animate() {
        requestAnimationFrame(animate);
        currentInput.lerp(targetInput, CONFIG.lerpFactor);
        const t = performance.now() * 0.001;
        zebraMat.uniforms.uTime.value = t;
        shieldMat.uniforms.uTime.value = t;
        shieldMat.uniforms.uMouse.value.copy(currentInput);
        inner.rotation.y += 0.005;
        ghost.rotation.set(-currentInput.y * 0.5, currentInput.x * 0.5, 0);
        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        shieldMat.uniforms.uAspect.value = camera.aspect;
    };
</script>
</body>
</html>
